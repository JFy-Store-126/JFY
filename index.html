let _jfyExporting = false;
async function jfyExportGithub(){
  if(_jfyExporting) return; _jfyExporting = true;
  const btn = document.getElementById("btnGhZip"); if(btn){ btn.disabled = true; btn.textContent = "⏳ جاري تجهيز الملفات..."; }
  try{
    const files = new Map();     // مسار -> {blob, crc}
    const conv = async (val, kind)=>{
      if(typeof val !== "string") return val;
      let base = val, suffix = "";
      const sm = /#jfy=[vh]$/.exec(base); if(sm){ suffix = sm[0]; base = base.slice(0, sm.index); }
      let blob, mime = "", marker = "", name = "";
      if(base.indexOf("data:")===0){
        const pd = jfyParseDataUrl(base); if(!pd) return val;
        mime = pd.mime; marker = pd.marker; blob = jfyB64ToBlob(pd.b64, mime);
      }else if(base.indexOf("blob:")===0){
        const rec = JFY_BLOBS.get(base);
        if(!rec) throw new Error("فيديو من الجهاز ضاع (الصفحة اتحدثت قبل التنزيل) — احذفه وارفعه تاني");
        blob = rec.file; mime = rec.file.type || ""; name = rec.name || "";
      }else return val;   // رابط خارجي أو مسار media/ قديم: يفضل زي ما هو
      const sc = await jfyScanBlob(blob);
      const path = "media/" + sc.crc.toString(16).padStart(8,"0") + sc.fnv.toString(16).padStart(8,"0") + blob.size.toString(16) + "." + jfyExt(mime, name, kind);
      if(!files.has(path)) files.set(path, {blob:blob, crc:sc.crc});
      return path + (marker ? "#jfybg="+marker : "") + suffix;
    };
    const out = Object.assign({}, DATA); out.products = [];
    for(const p of (DATA.products||[])){
      const q = Object.assign({}, p);
      if(Array.isArray(p.images)){ q.images = []; for(const im of p.images) q.images.push(await conv(im, "image")); }
      if(Array.isArray(p.videos)){ q.videos = []; for(const v of p.videos) q.videos.push(await conv(v, "video")); }
      if(typeof p.video === "string" && p.video) q.video = await conv(p.video, "video");
      out.products.push(q);
    }
    const htmlBlob = new Blob([snapshotFullHTML(out, true)], {type:"text/html;charset=utf-8"});
    const hs = await jfyScanBlob(htmlBlob);
    const entries = [{name:"index.html", blob:htmlBlob, crc:hs.crc}];
    files.forEach((v,k)=>entries.push({name:k, blob:v.blob, crc:v.crc}));
    const zip = jfyBuildZip(entries);
    const url = URL.createObjectURL(zip), a = document.createElement("a");
    a.href = url; a.download = "JFY_Store_GitHub.zip";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 120000);
    jfyShowExportSummary(htmlBlob.size, files);
  }catch(e){
    console.error(e);
    toast("فشل تجهيز النسخة: " + (e && e.message ? e.message : "خطأ غير معروف"));
  }finally{
    _jfyExporting = false;
    const b2 = document.getElementById("btnGhZip"); if(b2){ b2.disabled = false; b2.textContent = "⬇️ تنزيل نسخة GitHub (ZIP)"; }
  }
}

<script id="jfyAppIconScript">
/* ===== أيقونة التطبيق + وضع التطبيق (PWA) =====
   - بتتولّد أوتوماتيك من لوجو المتجر الحالي (DATA.logo أو اللوجو الأساسي) وبتتحدّث أول ما اللوجو يتغيّر.
   - مهما كانت خلفية اللوجو (شفافة / ملوّنة / بيضاء / سودا) بيتحط على خلفية مناسبة بدون قص ولا تشويه.
   - لما الأيقونة تتحفظ على الشاشة الرئيسية، المتجر بيفتح بدون شريط المتصفح (standalone). */
(function(){
  var lastKey = null, manifestUrl = null, busy = null;

  function loadImg(src){
    return new Promise(function(res, rej){
      var i = new Image(); i.onload = function(){ res(i); }; i.onerror = rej; i.src = src;
    });
  }
  function hex2(n){ n = Math.max(0, Math.min(255, Math.round(n))); return (n<16?"0":"") + n.toString(16); }

  /* تحليل اللوجو: يحدد لون الخلفية المناسب والمنطقة الفعلية للرسمة */
  function analyze(img){
    var W = img.naturalWidth || img.width, H = img.naturalHeight || img.height;
    var k = Math.min(1, 256 / Math.max(W, H));
    var w = Math.max(1, Math.round(W*k)), h = Math.max(1, Math.round(H*k));
    var c = document.createElement("canvas"); c.width = w; c.height = h;
    var x = c.getContext("2d", {willReadFrequently:true}); x.drawImage(img, 0, 0, w, h);

        }

        }

    /* manifest: بيتبني من اللوجو الحالي، وبيتفتح بدون شريط المتصفح */
    if(location.protocol === "http:" || location.protocol === "https:"){
      var u = new URL(location.href); u.hash = "";
      var m = {
        name: name, short_name: name, description: name + " — Just For You",
        lang: "ar", dir: "rtl",
        start_url: u.href, scope: new URL("./", u).href,
        display: "standalone", display_override: ["standalone", "minimal-ui"],
        background_color: info.bg, theme_color: "#FFFFFF",
        icons: [
          {src: any192,  sizes: "192x192", type: "image/png", purpose: "any maskable"},
          {src: any512,  sizes: "512x512", type: "image/png", purpose: "any maskable"}
        ]
      };
      var blobUrl = URL.createObjectURL(new Blob([JSON.stringify(m)], {type: "application/manifest+json"}));
      setLink("manifest", "manifest", null, blobUrl);
      if(manifestUrl){ try{ URL.revokeObjectURL(manifestUrl); }catch(e){} }
      manifestUrl = blobUrl;
    }
    lastKey = key;
    window.JFY_APP_ICONS = {bg: info.bg, any512: any512, any192: any192, mask512: mask512, apple180: apple180, fav: fav32};
  }

  window.jfyApplyAppIcons = function(){
    busy = (busy || Promise.resolve()).then(apply).catch(function(e){ console.warn("app icon", e); });
    return busy;
  };
  window.jfyApplyAppIcons();
})();
</script>
