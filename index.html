    lh.setUint16(10,dt,true); lh.setUint16(12,dd,true); lh.setUint32(14,e.crc,true); lh.setUint32(18,size,true); lh.setUint32(22,size,true);
    lh.setUint16(26,nb.length,true); lh.setUint16(28,0,true);
    parts.push(lh.buffer, nb, e.blob);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true); ch.setUint16(10,0,true);
    ch.setUint16(12,dt,true); ch.setUint16(14,dd,true); ch.setUint32(16,e.crc,true); ch.setUint32(20,size,true); ch.setUint32(24,size,true);
    ch.setUint16(28,nb.length,true); ch.setUint16(30,0,true); ch.setUint16(32,0,true); ch.setUint16(34,0,true); ch.setUint16(36,0,true);
    ch.setUint32(38,0,true); ch.setUint32(42,offset,true);
    central.push(ch.buffer, nb);
    offset += 30 + nb.length + size;
  });
  let cs=0; central.forEach(x=>{ cs += (x.byteLength!==undefined ? x.byteLength : x.length); });
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,entries.length,true); end.setUint16(10,entries.length,true); end.setUint32(12,cs,true); end.setUint32(16,offset,true);
  return new Blob(parts.concat(central, [end.buffer]), {type:"application/zip"});
}
let _jfyExporting = false;
async function jfyExportGithub(){
  if(_jfyExporting) return; _jfyExporting = true;
  const btn = document.getElementById("btnGhZip"); if(btn){ btn.disabled = true; btn.textContent = "⏳ جاري تجهيز الملفات..."; }
  try{
    const files = new Map();     // مسار -> {blob, crc}
    const conv = async (val, kind)=>{
      if(typeof val !== "string") return val;
      let base = val, suffix = "";
      const sm = /#jfy=[vh]$/.exec(base); if(sm){ suffix = sm[0]; base = base.slice(0, sm.index); }
      let blob, mime = "", marker = "", name = "";
      if(base.indexOf("data:")===0){
        const pd = jfyParseDataUrl(base); if(!pd) return val;
        mime = pd.mime; marker = pd.marker; blob = jfyB64ToBlob(pd.b64, mime);
      }else if(base.indexOf("blob:")===0){
        const rec = JFY_BLOBS.get(base);
        if(!rec) throw new Error("فيديو من الجهاز ضاع (الصفحة اتحدثت قبل التنزيل) — احذفه وارفعه تاني");
        blob = rec.file; mime = rec.file.type || ""; name = rec.name || "";
      }else return val;   // رابط خارجي أو مسار media/ قديم: يفضل زي ما هو
      const sc = await jfyScanBlob(blob);
      const path = "media/" + sc.crc.toString(16).padStart(8,"0") + sc.fnv.toString(16).padStart(8,"0") + blob.size.toString(16) + "." + jfyExt(mime, name, kind);
      if(!files.has(path)) files.set(path, {blob:blob, crc:sc.crc});
      return path + (marker ? "#jfybg="+marker : "") + suffix;
    };
    const out = Object.assign({}, DATA); out.products = [];
    for(const p of (DATA.products||[])){
      const q = Object.assign({}, p);
      if(Array.isArray(p.images)){ q.images = []; for(const im of p.images) q.images.push(await conv(im, "image")); }
      if(Array.isArray(p.videos)){ q.videos = []; for(const v of p.videos) q.videos.push(await conv(v, "video")); }
      if(typeof p.video === "string" && p.video) q.video = await conv(p.video, "video");
      out.products.push(q);
    }
    const htmlBlob = new Blob([snapshotFullHTML(out, true)], {type:"text/html;charset=utf-8"});
    const hs = await jfyScanBlob(htmlBlob);
    const entries = [{name:"index.html", blob:htmlBlob, crc:hs.crc}];
    files.forEach((v,k)=>entries.push({name:k, blob:v.blob, crc:v.crc}));
    const zip = jfyBuildZip(entries);
    const url = URL.createObjectURL(zip), a = document.createElement("a");
    a.href = url; a.download = "JFY_Store_GitHub.zip";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 120000);
    jfyShowExportSummary(htmlBlob.size, files);
  }catch(e){
    console.error(e);
    toast("فشل تجهيز النسخة: " + (e && e.message ? e.message : "خطأ غير معروف"));
  }finally{
    _jfyExporting = false;
    const b2 = document.getElementById("btnGhZip"); if(b2){ b2.disabled = false; b2.textContent = "⬇️ تنزيل نسخة GitHub (ZIP)"; }
  }
}
function jfyShowExportSummary(htmlSize, files){

    <ol style="margin:10px 0 0;padding-right:18px;font-size:13px">

      <li>اضغط <b>Commit changes</b> واستنى دقيقة أو اتنين.</li>
    </ol>
    <p style="margin:8px 0 0;font-size:12px;color:var(--muted)">الصور والفيديوهات القديمة اللي على GitHub مش محتاجة ترفعها تاني. ارفع الجديد بس.</p>
    <button class="btn-primary" style="margin-top:12px" onclick="closeModal()">تمام</button>
  </div>`);
}
/* فحص الصور والفيديوهات على الموقع المنشور: بيتأكد إن كل ملف media/ مرجوع في المنتجات موجود فعلاً على GitHub */
async function jfyCheckMedia(){
  const box = t => openModal('<div style="line-height:1.9"><h3 style="margin:0 0 6px">🔎 فحص الصور والفيديوهات</h3>'+t+'<button class="btn-primary" style="margin-top:12px" onclick="closeModal()">تمام</button></div>');
  if(location.protocol !== "https:" && location.protocol !== "http:"){
    box('<p style="font-size:13px">الفحص بيشتغل على <b>الموقع المنشور</b> بس. افتح موقعك على GitHub Pages (الرابط اللي بيبدأ بـ https) وادخل لوحة التحكم وجرّب تاني.</p>'); return;
  }
  const items = new Map();
  const add = (p, v, kind)=>{
    if(typeof v !== "string") return;
    const base = v.replace(/#(jfy|jfybg)=[a-z]$/, "");
    if(!/^media\//.test(base)) return;
    if(!items.has(base)) items.set(base, {path:base, kind:kind, prods:[]});
    const it = items.get(base); if(it.prods.indexOf(p.name) < 0) it.prods.push(p.name);
  };
  (DATA.products||[]).forEach(p=>{ (p.images||[]).forEach(v=>add(p,v,"image")); (p.videos||[]).forEach(v=>add(p,v,"video")); if(typeof p.video==="string" && p.video) add(p,p.video,"video"); });
  if(!items.size){ box('<p style="font-size:13px">مفيش صور أو فيديوهات محفوظة كملفات منفصلة في المتجر ده لسه، فمفيش حاجة تتفحص.</p>'); return; }
  const btn = document.getElementById("btnCheckMedia"); if(btn){ btn.disabled = true; btn.textContent = "⏳ جاري الفحص..."; }
  try{
    const list = Array.from(items.values()), bad = []; let idx = 0;
    const worker = async ()=>{ while(idx < list.length){ const it = list[idx++];
      try{ const r = await fetch(it.path, {method:"HEAD", cache:"no-store"}); if(!r.ok) bad.push(Object.assign({code:r.status}, it)); }
      catch(e){ bad.push(Object.assign({code:0}, it)); } } };
    await Promise.all([worker(), worker(), worker(), worker()]);
    if(!bad.length){
      box('<div class="ok" style="background:#ddf4e4;border:1px solid #8fd1a4;border-radius:10px;padding:10px 12px;font-size:13.5px">✅ كل الملفات (<b>'+list.length+'</b>) موجودة على الموقع. لو لسه مش ظاهرة عندك، اعمل تحديث إجباري (Ctrl + F5).</div>');
    }else{
      const rows = bad.slice(0,15).map(b=>'<div style="direction:ltr;text-align:left;font-size:12px;padding:3px 0;border-bottom:1px solid var(--border)">'+escapeHtml(b.path)+' <span style="color:#b3261e">('+(b.code||"خطأ اتصال")+')</span><div dir="rtl" style="color:var(--muted)">'+escapeHtml(b.prods.join("، "))+'</div></div>').join("");
      box('<div style="background:#fdecea;border:1px solid #e08a84;border-radius:10px;padding:10px 12px;font-size:13.5px">⚠️ <b>'+bad.length+'</b> ملف من <b>'+list.length+'</b> مش موجود على الموقع:</div>'+rows+(bad.length>15?'<div style="font-size:12px;color:var(--muted)">+ '+(bad.length-15)+' ملف تاني</div>':'')+
        '<ol style="margin:10px 0 0;padding-right:18px;font-size:13px"><li>افتح الـ Repository على GitHub: لازم تشوف <b dir="ltr">index.html</b> وفولدر <b dir="ltr">media</b> <b>جنب بعض</b> في الصفحة الرئيسية (مش جوه فولدر تاني).</li><li>افتح فولدر <b dir="ltr">media</b> وتأكد إن الملفات اللي فوق موجودة بنفس الأسماء.</li><li>لو ناقصة: ارفع فولدر <b dir="ltr">media</b> كله بالسحب والإفلات (مش بزرار choose your files)، واضغط Commit changes، واستنى دقيقتين وافحص تاني.</li></ol>');
    }
  }catch(e){ box('<p style="font-size:13px">حصلت مشكلة في الفحص: '+escapeHtml(String(e && e.message || e))+'</p>'); }
  finally{ const b2 = document.getElementById("btnCheckMedia"); if(b2){ b2.disabled = false; b2.textContent = "🔎 فحص الصور والفيديوهات على الموقع"; } }
}
