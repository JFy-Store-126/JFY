<!DOCTYPE html>
<html lang="ar" dir="rtl" class=""><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light only">
<title>JFY Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --navy:#101E38; --navy-2:#1B2C4F; --copper:#B8763E; --copper-2:#D79A5C;
  --cream:#FAF7F2; --paper:#FFFFFF; --ink:#1C1A17; --muted:#7A7268; --border:#E7E1D6;
  --danger:#B0413E; --ok:#3E7A4F;
  --bronze:#B87A45; --wine:#7B1E3A;
}
/* الوضع الداكن للموبايل: المتجر بيفضل بنفس شكل الوضع العادي بالظبط */
html{color-scheme:light only;background:#FAF7F2}
:root{color-scheme:light only}
*{box-sizing:border-box}
html{scroll-padding-top:60px}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Cairo',system-ui,sans-serif;
  padding-bottom:env(safe-area-inset-bottom,0px);}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}

/* header */
header.top{position:sticky;top:0;z-index:40;background:var(--paper);color:var(--ink);
  border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top,0px)}
.topbar{display:flex;align-items:center;gap:14px;padding:10px 18px;max-width:1180px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;flex:1;min-width:0;color:var(--bronze)}
.brand .bname{color:var(--bronze)}
.brand img{height:42px;width:42px;object-fit:contain;border-radius:8px;flex:none}
.brand span small{display:block;font-size:10px;font-weight:600;color:var(--copper);letter-spacing:.4px}
.iconbtn{background:transparent;border:none;color:var(--navy);font-size:19px;padding:7px 10px;position:relative;
  border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1}
.iconbtn .ib-label{font-size:10px;font-weight:700;color:var(--ink)}
@media(hover:hover){.iconbtn:hover{background:var(--cream)}}
.badge{position:absolute;top:2px;left:2px;background:var(--copper);color:#fff;font-size:10px;font-weight:700;
  border-radius:999px;min-width:17px;height:17px;padding:0 4px;line-height:1;display:flex;align-items:center;justify-content:center}
.iconbtn.lit .ib-label{color:var(--wine)}
.searchbar{display:none;padding:0 18px 12px;max-width:1180px;margin:0 auto;gap:8px;align-items:stretch}
.searchbar.open{display:flex}
.searchbar input{flex:1;min-width:0;padding:11px 14px;border-radius:10px;border:1px solid var(--border);
  background:var(--cream);color:var(--bronze);-webkit-text-fill-color:var(--bronze);caret-color:var(--bronze);
  font-family:inherit;font-size:16px;font-weight:600;-webkit-appearance:none;appearance:none}
.searchbar input:focus{outline:none;border-color:var(--bronze)}
.searchbar input::placeholder{color:var(--muted);-webkit-text-fill-color:var(--muted);font-weight:400}
.search-go{flex:none;background:var(--wine);color:#fff;border:none;border-radius:10px;padding:0 20px;font-weight:800;
  font-size:14.5px;opacity:.45;transition:opacity .08s,box-shadow .08s}
.search-go.on{opacity:1;box-shadow:0 0 0 3px color-mix(in srgb, var(--wine) 28%, transparent)}

/* categories strip */
.cats{display:flex;gap:10px;overflow-x:auto;padding:14px 18px;max-width:1180px;margin:0 auto;-webkit-overflow-scrolling:touch}
.cats::-webkit-scrollbar{display:none}
.catchip{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 16px;
  background:var(--paper);border:1px solid var(--border);border-radius:14px;min-width:78px;transition:transform .15s,border-color .15s}
.catchip .ic{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--navy-2));
  color:var(--copper-2);display:flex;align-items:center;justify-content:center;font-size:17px;overflow:hidden}
.catchip .ic img{width:100%;height:100%;object-fit:cover}
.catchip span{font-size:12.5px;font-weight:600;white-space:nowrap}
.catchip.active{border-color:var(--copper);background:color-mix(in srgb, var(--copper) 10%, var(--paper))}
.catchip:active{transform:scale(.96)}

main{max-width:1180px;margin:0 auto;padding:6px 18px 70px}
.section-title{font-size:17px;font-weight:800;margin:18px 2px 12px;display:flex;justify-content:space-between;align-items:center}
.section-title small{font-size:12.5px;font-weight:600;color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(auto-fill,200px);gap:16px;justify-content:center}}

.card{background:transparent;border:1px solid var(--border);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.card .thumb{aspect-ratio:1/1;background:linear-gradient(135deg,var(--navy),var(--navy-2));position:relative;overflow:hidden}
.card .thumb img{width:100%;height:100%;object-fit:cover}
/* إطار موحد لكل الكروت (مربع) والصورة بتظهر كاملة من غير قص أو تمديد */
.card .thumb.fit{aspect-ratio:1/1;background:transparent}
.card .thumb.fit img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.card .thumb.fit img.jfy-blur{position:absolute;inset:-18px;width:calc(100% + 36px);height:calc(100% + 36px);object-fit:cover;filter:blur(16px) saturate(1.1);transform:scale(1.08);pointer-events:none;z-index:0}
.card .thumb.fit img:not(.jfy-blur){z-index:1}
.card .thumb.fit:has(img:is([src^="data:image/png;base64"],[src$=".png"])){background:linear-gradient(135deg,var(--navy),var(--navy-2))}
.card .thumb .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px;color:var(--copper-2)}
.card .demo-tag{position:absolute;top:8px;right:8px;background:rgba(16,30,56,.85);color:var(--copper-2);
  font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px}
.card .cbody{padding:11px 12px 13px;display:flex;flex-direction:column;gap:5px;flex:1;background:var(--paper)}
.card .cname{font-size:13.5px;font-weight:700;line-height:1.35;height:2.7em;margin-top:auto;display:flex;align-items:flex-end;overflow:hidden}
.card .cname span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .cprice{font-size:15px;font-weight:800;color:var(--copper)}
.card .cprice small{font-size:11px;color:var(--muted);font-weight:500}
.addbtn{margin-top:4px;background:var(--navy);color:#fff;border:none;border-radius:10px;padding:9px;font-weight:700;font-size:13px}
.addbtn:active{transform:scale(.98)}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty .e-ic{font-size:44px;margin-bottom:10px}

/* product page */
.pd-wrap{display:grid;gap:22px}
@media(min-width:760px){.pd-wrap{grid-template-columns:1fr 1fr;align-items:start}}
.gallery-main{aspect-ratio:1/1;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,var(--navy),var(--navy-2));
  position:relative;cursor:zoom-in}
.gallery-main img{width:100%;height:100%;object-fit:cover}
.gallery-main.fit{aspect-ratio:auto;background:none;border-radius:0;overflow:visible}
.gallery-main.fit img{width:auto;height:auto;max-width:100%;max-height:75vh;max-height:75dvh;margin:0 auto;object-fit:contain;
  border-radius:18px;background:linear-gradient(135deg,var(--navy),var(--navy-2))}
.gallery-main{touch-action:pan-y;-webkit-tap-highlight-color:transparent}
.gallery-main.gz-on{overflow:hidden}.gallery-main.gz-on img{will-change:transform}
.gallery-main img{-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
.gallery-main .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:70px;color:var(--copper-2)}
.gallery-thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto}
.gallery-thumbs .gt{width:62px;height:62px;flex:none;border-radius:10px;overflow:hidden;border:2px solid transparent;background:var(--navy)}
.gallery-thumbs .gt.active{border-color:var(--copper)}
.gallery-thumbs .gt img{width:100%;height:100%;object-fit:cover}
.pd-video{margin-top:14px;border-radius:14px;overflow:hidden;background:transparent;position:relative;cursor:zoom-in;
  -webkit-transform:translateZ(0);transform:translateZ(0);-webkit-backface-visibility:hidden;backface-visibility:hidden;isolation:isolate}
.pd-video iframe{width:100%;display:block;aspect-ratio:16/9;border:none;pointer-events:none;background:transparent;will-change:transform}
.pd-video.fbv{max-width:320px;margin-left:auto;margin-right:auto}
.pd-video.fbv iframe{aspect-ratio:9/16}
/* فيديو ملف (من الجهاز أو رابط مباشر): بيظهر كامل بنسبته الأصلية وبدون جوانب سوداء */
.pd-video video{display:block;margin:0 auto;width:auto;height:auto;max-width:100%;max-height:75vh;max-height:75dvh;border-radius:14px;background:transparent;pointer-events:none}
.pd-video.vf-v{max-width:320px;margin-left:auto;margin-right:auto}
.pd-video.vf-v video,.pd-video.vf-h video{width:100%;height:auto;max-height:none;object-fit:contain}
.pd-video.vf-v video{aspect-ratio:9/16}
.pd-video.vf-h video{aspect-ratio:16/9}
/* إنستجرام */
.pd-video.ig{cursor:auto;max-width:400px;margin-left:auto;margin-right:auto;background:#fff;-webkit-transform:none;transform:none;-webkit-backface-visibility:visible;backface-visibility:visible;isolation:auto}
.pd-video.ig .ig-wrap iframe{will-change:auto;touch-action:auto}
.pd-video.ig.igh{max-width:540px}
.igzoom{display:block;width:100%;border:none;border-top:1px solid var(--border);background:#fff;color:#1C1A17;font-family:inherit;font-weight:700;font-size:13px;padding:9px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.igzoom:active{background:var(--cream)}
.igzoom:focus-visible{outline:2px solid var(--copper);outline-offset:-2px}
.igbar{display:flex;border-top:1px solid var(--border);background:#fff}
.igbar .igzoom{flex:1;width:auto;border-top:none}
.igbar .igzoom+.igzoom{border-right:1px solid var(--border)}
.lightbox #lbVideoBox .igre{position:sticky;bottom:0;z-index:2;background:#fff}
.ig-wrap{position:relative;width:100%}
.ig-wrap::before{content:"";display:block;padding-bottom:calc(177.78% + 150px)}
.igp .ig-wrap::before{padding-bottom:calc(125% + 150px)}
.igh .ig-wrap::before{padding-bottom:calc(56.25% + 150px)}
.ig-wrap.m::before{display:none}
.pd-video .ig-wrap iframe{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;pointer-events:auto;background:#fff}
.pd-video .vz{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,.55);color:#fff;border-radius:8px;padding:3px 9px;font-size:12px;font-weight:700;pointer-events:none}
.pd-info h1{font-size:22px;margin:0 0 8px;font-weight:800}
.pd-price{font-size:26px;font-weight:800;color:var(--copper);margin:4px 0 2px}
.pd-shipping-note{font-size:12.5px;color:var(--muted);margin-bottom:16px}
.pd-desc{font-size:14px;line-height:1.9;color:var(--ink);margin-bottom:18px;white-space:pre-line}
.qty-row{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.qty-box{display:flex;align-items:center;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.qty-box button{background:var(--paper);color:var(--ink);border:none;width:38px;height:38px;font-size:18px;font-weight:700}
.qty-box span{width:36px;text-align:center;font-weight:700}
.size-row{margin-bottom:16px}
.size-row .sl{font-weight:700;font-size:13.5px;display:block;margin-bottom:8px}
.size-chips{display:flex;flex-wrap:wrap;gap:8px}
.size-chip{min-width:46px;padding:9px 13px;border:1.5px solid var(--border);border-radius:10px;background:var(--paper);color:var(--ink);font-family:inherit;font-weight:700;font-size:14px}
.size-chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.size-chip.dim{opacity:.4}
.btn-primary{background:var(--copper);color:#fff;border:none;border-radius:12px;padding:14px 18px;font-weight:800;font-size:15px;width:100%}
.btn-primary:active{transform:scale(.985)}
.btn-secondary{background:var(--paper);color:var(--ink);border:1px solid var(--border);border-radius:12px;padding:12px 16px;font-weight:700;width:100%}
.backlink{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13.5px;color:var(--muted);margin:14px 0 4px}

/* lightbox */
.lightbox{position:fixed;inset:0;background:rgba(8,10,16,.94);z-index:200;display:none;align-items:center;justify-content:center;
  padding:env(safe-area-inset-top,0px) 10px env(safe-area-inset-bottom,0px)}
.lightbox.open{display:flex;touch-action:pan-y}
@keyframes lbSlide{from{opacity:0;transform:translateX(var(--d,0px))}to{opacity:1;transform:none}}
@keyframes lbFade{from{opacity:0}to{opacity:1}}
.lightbox #lbImg.sl{animation:lbSlide .22s ease-out}
.lightbox #lbVideoBox.sl{animation:lbFade .22s ease-out}
/* مناطق سحب فوق مشغّلات (يوتيوب/فيسبوك/إنستجرام) عشان المتصفح مش بيوصّل اللمس اللي جوا الإطار للصفحة. الوسط والشريط السفلي بيفضلوا شغالين للتحكم في الفيديو */
.lightbox .lb-sw{display:none;position:fixed;z-index:4;touch-action:pan-y;background:transparent}
.lightbox.vmode.swz .lb-sw{display:block}
.lightbox img{width:auto;height:auto;max-width:94vw;max-height:80vh;max-height:80dvh;object-fit:contain;border-radius:8px}
.lightbox .lb-close{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;z-index:5;cursor:pointer;padding:8px 12px;line-height:1;color:#fff;font-size:26px;background:none;border:none}
.lightbox .lb-nav{position:absolute;top:50%;transform:translateY(-50%);color:#fff;background:rgba(255,255,255,.12);
  border:none;width:46px;height:46px;border-radius:50%;font-size:22px}
.lightbox .lb-prev{right:14px}.lightbox .lb-next{left:14px}
.lightbox #lbImg{touch-action:none;cursor:grab;transform-origin:center center;will-change:transform;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none}
.lightbox .lb-zoom{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);z-index:5;width:40px;height:40px;border-radius:50%;border:none;
  background:rgba(255,255,255,.16);color:#fff;font-size:24px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
.lightbox #lbZoomIn{left:72px}.lightbox #lbZoomOut{left:120px}
.lightbox .lb-zoom:disabled{opacity:.35}
.lightbox.vmode .lb-zoom{display:none}
.lightbox .lb-count{pointer-events:none;position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);color:#fff;font-size:13px;opacity:.8}
.lightbox .lb-price{pointer-events:none;position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);right:0;left:0;text-align:center;color:#fff}
.lightbox .lb-price b{display:block;font-size:17px;color:var(--copper-2)}
.lightbox .lb-price small{font-size:11.5px;opacity:.75}
.lightbox #lbVideoBox{display:none;width:min(94vw,900px)}
.lightbox.vmode #lbVideoBox{display:block}
.lightbox.vmode #lbImg{display:none}
.lightbox #lbVideoBox iframe.fbv{aspect-ratio:9/16;height:min(80vh,167vw);width:auto;max-width:100%;margin:0 auto}
.lightbox.vmode .lb-nav{z-index:6}
.lightbox #lbVideoBox video{display:block;margin:0 auto;width:auto;height:auto;max-width:94vw;max-height:84vh;max-height:84dvh;object-fit:contain;background:transparent;border-radius:8px}
.lightbox #lbVideoBox video.lbv-v{height:min(84vh,167vw);width:auto;aspect-ratio:9/16}
.lightbox #lbVideoBox video.lbv-h{width:min(94vw,900px);height:auto;aspect-ratio:16/9}
.lightbox #lbVideoBox iframe{width:100%;aspect-ratio:16/9;max-height:80vh;border:none;background:transparent;border-radius:8px;display:block}
.lightbox #lbVideoBox.ig{width:min(96vw,500px);max-height:88vh;max-height:88dvh;overflow-y:auto;border-radius:8px;background:#fff}
.lightbox #lbVideoBox.ig.igh{width:min(96vw,640px)}
.lightbox #lbVideoBox.ig{scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
.lightbox #lbVideoBox.ig::-webkit-scrollbar{display:none}
.lightbox #lbVideoBox .ig-wrap iframe{position:absolute;inset:0;width:100%;height:100%;max-height:none;aspect-ratio:auto;border-radius:0;background:#fff}

/* cart drawer */
.overlay{position:fixed;inset:0;background:rgba(10,12,18,.5);z-index:100;display:none}
.overlay.open{display:block}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(400px,92vw);background:var(--paper);z-index:101;
  transform:translateX(-100%);transition:transform .25s ease;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border)}
.drawer-head h3{margin:0;font-size:17px;font-weight:800}
.drawer-body{flex:1;overflow-y:auto;padding:12px 18px}
.cart-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}
.cart-item .ci-thumb{width:60px;height:60px;border-radius:10px;background:var(--navy);flex:none;overflow:hidden;
  display:flex;align-items:center;justify-content:center;color:var(--copper-2);font-size:22px}
.cart-item .ci-thumb img{width:100%;height:100%;object-fit:cover}
.cart-item .ci-body{flex:1;min-width:0}
.cart-item .ci-name{font-size:13.5px;font-weight:700;margin-bottom:4px}
.cart-item .ci-row{display:flex;align-items:center;justify-content:space-between}
.ci-del{background:none;border:none;color:var(--danger);font-size:12px;font-weight:700}
.drawer-foot{padding:16px 18px;border-top:1px solid var(--border)}
.total-row{display:flex;justify-content:space-between;font-weight:800;font-size:16px;margin-bottom:12px}

/* checkout */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.field input,.field textarea{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--border);
  background:var(--cream);color:var(--ink);font-family:inherit;font-size:14.5px}
.field .err{color:var(--danger);font-size:12px;margin-top:4px;display:none}
.field.invalid input{border-color:var(--danger)}
.field.invalid .err{display:block}

.toast-wrap{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:0;right:0;display:flex;justify-content:center;z-index:300;pointer-events:none}
.toast{background:var(--navy);color:#fff;padding:11px 20px;border-radius:30px;font-size:13.5px;font-weight:700;
  box-shadow:0 8px 20px rgba(0,0,0,.25);opacity:0;transform:translateY(10px);transition:.25s}
.toast.show{opacity:1;transform:translateY(0)}

footer.foot{text-align:center;padding:26px 18px calc(26px + env(safe-area-inset-bottom,0px));color:var(--muted);font-size:12px}

/* admin */
.admin-shell{min-height:100vh;background:var(--cream)}
.admin-login{max-width:360px;margin:14vh auto;padding:28px;background:var(--paper);border-radius:18px;border:1px solid var(--border)}
.admin-login h2{margin:0 0 4px;font-size:18px}
.admin-login p{color:var(--muted);font-size:13px;margin:0 0 18px}
.admin-bar{background:var(--paper);color:var(--ink);border-bottom:1px solid var(--border);padding:14px 18px;
  display:flex;align-items:center;gap:12px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.admin-bar b{flex:1;font-size:15px;color:var(--ink)}
.admin-tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 18px;background:var(--paper);border-bottom:1px solid var(--border)}
.admin-tab{padding:8px 14px;border-radius:20px;border:1px solid var(--border);font-size:13px;font-weight:700;background:var(--paper);flex:none}
.admin-tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.admin-main{padding:18px;max-width:900px;margin:0 auto}
.admin-row{display:flex;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--border);
  border-radius:12px;padding:10px 12px;margin-bottom:10px}
.admin-row .at{width:48px;height:48px;border-radius:9px;overflow:hidden;flex:none;background:var(--navy);
  display:flex;align-items:center;justify-content:center;color:var(--copper-2)}
.admin-row .at img{width:100%;height:100%;object-fit:cover}
.admin-row .ainfo{flex:1;min-width:0}
.admin-row .ainfo b{display:block;font-size:13.5px}

/* =====================================================
   SOFT THEME — نعومة ودقة + أنيميشن الكروت (نفس بنية الموقع)
   ===================================================== */
:root{
  --navy:#0E1A33; --navy-2:#182A4D; --cream:#F7F4EF; --border:#EAE5DC; --muted:#77716A;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --shadow-md:0 10px 30px -10px rgba(14,26,51,.22);
  --shadow-lg:0 24px 50px -18px rgba(14,26,51,.35);
}
body{-webkit-font-smoothing:antialiased;letter-spacing:.1px}

/* الهيدر: ناعم وشفاف */
header.top{background:rgba(255,255,255,.92);-webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid rgba(234,229,220,.9)}
.brand img{border-radius:12px;background:transparent;box-shadow:none}
.brand img[src^="data:image/jpeg"]{box-shadow:var(--shadow-sm)}
.iconbtn{border-radius:14px;transition:background .08s,transform .08s}
.iconbtn:active{transform:scale(.94)}
.badge{box-shadow:0 0 0 2px #fff}
.searchbar input{border-radius:999px;padding:12px 20px;border:1.5px solid transparent;transition:border-color .2s,background .2s,box-shadow .2s}
.searchbar input:focus{background:#fff;border-color:var(--copper);box-shadow:0 0 0 4px rgba(184,118,62,.12)}
.search-go{border-radius:999px;padding:0 24px}

/* أيقونات التصنيف دائرية */
.cats{gap:12px;padding:16px 18px 8px}
.catchip{background:transparent;border:none;min-width:82px;padding:4px 2px;gap:8px;transition:transform .08s}
.catchip .ic{width:68px;height:68px;font-size:28px;border:3px solid #fff;outline:1.5px solid var(--border);box-shadow:var(--shadow-sm);
  transition:outline-color .08s,transform .1s ease-out,box-shadow .1s}
@media(hover:hover){.catchip:hover .ic{transform:translateY(-3px);box-shadow:var(--shadow-md)}}
.catchip span{font-size:12.5px;font-weight:700;color:var(--muted);transition:color .08s}
.catchip.active{background:transparent}
.catchip.active .ic{outline:2.5px solid var(--copper);background:linear-gradient(135deg,var(--copper),var(--copper-2));color:#fff}
.catchip.active span{color:var(--ink);font-weight:800}
.catchip:active{transform:scale(.95)}
@media(min-width:760px){.cats{justify-content:center}.catchip .ic{width:78px;height:78px;font-size:32px}}

/* عنوان القسم */
.section-title{padding-bottom:6px;position:relative}
.section-title::after{content:"";position:absolute;right:2px;bottom:-4px;width:34px;height:3px;border-radius:3px;background:var(--copper)}
.section-title small{background:var(--paper);border:1px solid var(--border);padding:4px 12px;border-radius:999px;font-size:12px}

/* كروت المنتجات + الأنيميشن والوميض */
.card{background:var(--paper);border:1px solid transparent;border-radius:18px;box-shadow:var(--shadow-sm);position:relative;
  transition:transform .1s ease-out,box-shadow .1s ease-out,border-color .1s}
@media(hover:hover){.card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);border-color:var(--border)}}
.card:active{transform:translateY(-2px) scale(.99)}
.card .thumb img:not(.jfy-blur){transition:transform .12s ease-out}
@media(hover:hover){.card:hover .thumb img:not(.jfy-blur){transform:scale(1.06)}}
.card .thumb .ph{background:radial-gradient(circle at 50% 40%,rgba(224,168,105,.18),transparent 65%);transition:transform .12s ease-out}
@media(hover:hover){.card:hover .thumb .ph{transform:scale(1.12)}}
.card .demo-tag{background:rgba(255,255,255,.92);color:var(--navy);border:1px solid var(--border);backdrop-filter:blur(6px);z-index:4}
.card .cbody{border-top:1px solid var(--cream)}
.card .cprice{color:var(--navy)}
.addbtn{border-radius:12px;padding:11px;position:relative;overflow:hidden;transition:background .08s,transform .08s,box-shadow .1s}
@media(hover:hover){.card:hover .addbtn{background:linear-gradient(135deg,var(--copper),#9C5F2C);box-shadow:0 10px 20px -10px rgba(184,118,62,.9)}}
.addbtn:active{transform:scale(.97)}
/* حركة دخول ناعمة */
@keyframes jfyUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
html.jfy-anim .card{animation:jfyUp .55s cubic-bezier(.2,.8,.2,1) both}
html.jfy-anim .grid .card:nth-child(2){animation-delay:.05s}html.jfy-anim .grid .card:nth-child(3){animation-delay:.1s}html.jfy-anim .grid .card:nth-child(4){animation-delay:.15s}
html.jfy-anim .grid .card:nth-child(5){animation-delay:.2s}html.jfy-anim .grid .card:nth-child(6){animation-delay:.25s}html.jfy-anim .grid .card:nth-child(n+7){animation-delay:.3s}
.empty{background:var(--paper);border:1px dashed var(--border);border-radius:18px}

/* لمسات نعومة عامة */
.btn-primary{border-radius:14px;box-shadow:0 14px 28px -14px rgba(184,118,62,.95);transition:transform .08s,box-shadow .1s,filter .08s}
@media(hover:hover){.btn-primary:hover{filter:brightness(1.05)}}
.size-chip{border-radius:12px;transition:all .08s}
.size-chip.on{box-shadow:0 8px 18px -8px rgba(14,26,51,.7)}
.gallery-main,.gallery-main.fit img{border-radius:22px}
.gallery-thumbs .gt{border-radius:12px;opacity:1;transition:border-color .08s,transform .08s}
.gallery-thumbs .gt.active{opacity:1;transform:translateY(-2px)}
.qty-box{border-radius:12px}
.drawer{box-shadow:var(--shadow-lg)}
.cart-item .ci-thumb{border-radius:12px}
.overlay{-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.field input,.field textarea{border-radius:12px;transition:border-color .2s,box-shadow .2s}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--copper);box-shadow:0 0 0 4px rgba(184,118,62,.12)}
.toast{border:1px solid rgba(224,168,105,.35)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


/* ===== خيار خلفية صورة الكارت: بدون خلفية خالص ===== */
.card:has(.thumb.nobg){background:transparent;box-shadow:none;border-color:transparent;overflow:visible}
@media(hover:hover){.card:has(.thumb.nobg):hover{box-shadow:none;border-color:transparent}}
.card .thumb.nobg,.card .thumb.nobg.fit{background:transparent!important}
.card .thumb.nobg img,.card .thumb.nobg img:not(.jfy-blur){background:transparent!important}
.card .thumb.nobg img.jfy-blur{display:none}
.card:has(.thumb.nobg) .cbody{border-radius:16px;margin-top:6px;border-top:none;box-shadow:var(--shadow-sm);transition:box-shadow .1s}
@media(hover:hover){.card:has(.thumb.nobg):hover .cbody{box-shadow:var(--shadow-lg)}}

/* ===== زرار حذف في السلة: أنيميشن + إيموجي ===== */
.ci-del{display:inline-flex;align-items:center;gap:0;padding:5px 10px;margin-top:2px;border-radius:999px;position:relative;
  transition:background .08s,color .08s}
.ci-del:hover,.ci-del:focus-visible,.ci-del:active{background:rgba(176,65,62,.09);color:#8E2F2C}
.ci-del:active{transform:scale(.96)}
.ci-del .ci-del-t{display:inline-block;transform-origin:50% 100%}
.ci-del:hover .ci-del-t,.ci-del:focus-visible .ci-del-t,.ci-del:active .ci-del-t{animation:jfyShake .55s ease-in-out}
.ci-del .ci-del-e{display:inline-flex;align-items:center;justify-content:center;max-width:0;opacity:0;overflow:hidden;padding:5px 0;font-size:20px;line-height:1;
  transform:scale(.2) rotate(-25deg);transition:max-width .28s ease,opacity .2s,margin .28s,transform .45s cubic-bezier(.34,1.7,.5,1)}
.ci-del .ci-del-e img{width:24px;height:24px;object-fit:cover;border-radius:50%;display:block}
.ci-del:hover .ci-del-e,.ci-del:focus-visible .ci-del-e,.ci-del:active .ci-del-e{max-width:34px;opacity:1;margin-inline-start:6px;transform:scale(1) rotate(0);animation:jfyBob 1.1s ease-in-out .45s infinite}
@keyframes jfyShake{0%,100%{transform:translateX(0) rotate(0)}15%{transform:translateX(-3px) rotate(-4deg)}35%{transform:translateX(3px) rotate(4deg)}55%{transform:translateX(-2px) rotate(-3deg)}75%{transform:translateX(2px) rotate(2deg)}}
@keyframes jfyBob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.12)}}


/* ===== إيموجي الحذف: نفس الشكل بالظبط على الكمبيوتر والموبايل (ظاهر دايمًا جنب كلمة حذف) ===== */
.ci-del .ci-del-e,.ci-del:hover .ci-del-e,.ci-del:focus-visible .ci-del-e,.ci-del:active .ci-del-e{max-width:34px;opacity:1;margin-inline-start:6px;transform:none;animation:jfyBob 1.4s ease-in-out infinite}
.ci-del .ci-del-t{animation:jfyShake .7s ease-in-out .5s 1 both}
.ci-del:hover .ci-del-t,.ci-del:focus-visible .ci-del-t,.ci-del:active .ci-del-t{animation:jfyShake .55s ease-in-out}
.ci-del:hover,.ci-del:focus-visible{background:rgba(176,65,62,.09);color:#8E2F2C}
.ci-del:active{background:rgba(176,65,62,.12);color:#8E2F2C;transform:scale(.96)}


/* ===== اللمس (موبايل): نفس تأثيرات التحويم بالظبط وقت لمس العنصر ===== */
.catchip.hv .ic{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.card.hv{transform:translateY(-6px);box-shadow:var(--shadow-lg);border-color:var(--border)}
.card.hv .thumb img:not(.jfy-blur){transform:scale(1.06)}
.card.hv .thumb .ph{transform:scale(1.12)}
.card.hv .addbtn{background:linear-gradient(135deg,var(--copper),#9C5F2C);box-shadow:0 10px 20px -10px rgba(184,118,62,.9)}
.btn-primary.hv{filter:brightness(1.05)}
.card:has(.thumb.nobg).hv{box-shadow:none;border-color:transparent}
.card:has(.thumb.nobg).hv .cbody{box-shadow:var(--shadow-lg)}
.ci-del.hv,.ci-del:focus-visible,.ci-del:active{background:rgba(176,65,62,.09);color:#8E2F2C}
.ci-del.hv .ci-del-t,.ci-del:focus-visible .ci-del-t,.ci-del:active .ci-del-t{animation:jfyShake .55s ease-in-out}
.ci-del.hv .ci-del-e,.ci-del:focus-visible .ci-del-e,.ci-del:active .ci-del-e{max-width:34px;opacity:1;margin-inline-start:6px;transform:scale(1) rotate(0);animation:jfyBob 1.1s ease-in-out .45s infinite}
.ci-del .ci-del-e,.ci-del.hv .ci-del-e,.ci-del:focus-visible .ci-del-e,.ci-del:active .ci-del-e{max-width:34px;opacity:1;margin-inline-start:6px;transform:none;animation:jfyBob 1.4s ease-in-out infinite}
.ci-del.hv .ci-del-t,.ci-del:focus-visible .ci-del-t,.ci-del:active .ci-del-t{animation:jfyShake .55s ease-in-out}
.ci-del.hv,.ci-del:focus-visible{background:rgba(176,65,62,.09);color:#8E2F2C}

/* ===== سلة المهملات: كلمة "حذف" والإيموجي ثابتين بدون أي أنيميشن (موبايل وكمبيوتر) ===== */
.ci-del,.ci-del:hover,.ci-del:active,.ci-del.hv{transform:none!important}
.ci-del .ci-del-t,.ci-del:hover .ci-del-t,.ci-del:focus-visible .ci-del-t,.ci-del:active .ci-del-t,.ci-del.hv .ci-del-t{animation:none!important;transform:none!important}
.ci-del .ci-del-e,.ci-del:hover .ci-del-e,.ci-del:focus-visible .ci-del-e,.ci-del:active .ci-del-e,.ci-del.hv .ci-del-e{animation:none!important;transform:none!important;transition:none!important}

/* ===== استجابة اللمس الفورية ===== */
.card,.catchip,.iconbtn,.btn-primary,.addbtn,.size-chip,.ci-del,.backlink,.gt,.search-go{-webkit-tap-highlight-color:transparent;touch-action:manipulation}

/* منع قايمة الضغط المطوّل (فتح/نسخ/تنزيل الصورة) على الكروت والتصنيفات وصور المنتج */
.card,.card *,.catchip,.catchip *,.gt,.gt *,.gallery-main,.gallery-main img{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.card img,.catchip img,.gt img,.gallery-main img{-webkit-user-drag:none;user-drag:none}

function loadData(){
  // المصدر الأساسي: البيانات المضمّنة في نفس الصفحة (آخر نسخة تم نشرها) — بهذا الشكل
  // أي حد يفتح رابط المتجر يشوف نفس التحديثات اللي عملها المالك من لوحة التحكم.
  try{
    const el = document.getElementById("storeDataJSON");
    if(el && el.textContent.trim()){
      const d = JSON.parse(el.textContent);
      if(d && Array.isArray(d.categories) && Array.isArray(d.products)) return d;
    }
  }catch(e){ console.warn("تعذر قراءة بيانات المتجر المضمّنة", e); }
  // احتياطي: لو الصفحة بتتفتح محليًا بدون نشر (وضع تجربة على نفس الجهاز)
  try{
    const raw = LS.get("jfy_data");
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {logo:null, categories:DEFAULT_CATS, products:DEFAULT_PRODUCTS};
}

/* ================= NETWORK PUBLISH (يخلي كل الزوار يشوفوا تحديثات المالك) ================= */
let _artifactCapPromise = null;
function getArtifactCap(){
  if(!window.claude || typeof window.claude.use !== "function") return Promise.resolve(null);
  if(!_artifactCapPromise) _artifactCapPromise = window.claude.use("artifact").catch(()=>null);
  return _artifactCapPromise;
}
function snapshotFullHTML(newData, noLive){
  // نعمل نسخة من الصفحة وننظفها (بدون لوحة تحكم مفتوحة أو سلة أو نوافذ) عشان الصفحة المنشورة تفتح نضيفة
  const json = JSON.stringify(newData).replace(/</g,"\\u003c");
  const live = document.getElementById("storeDataJSON"); if(live && !noLive) live.textContent = json;
  const clone = document.documentElement.cloneNode(true);
  { const mf = clone.querySelector('link[rel="manifest"]'); if(mf) mf.remove(); }
  const app = clone.querySelector("#app"); if(app) app.innerHTML = "";
  ["cartOverlay","cartDrawer","modalOverlay","lightbox"].forEach(id=>{ const el=clone.querySelector("#"+id); if(el) el.classList.remove("open"); });
  const lbx = clone.querySelector("#lightbox"); if(lbx) lbx.classList.remove("vmode");
  { const lvb = clone.querySelector("#lbVideoBox"); if(lvb) lvb.removeAttribute("class"); }
  ["modalBody","cartBody","cartFoot","lbCount","lbPrice","lbVideoBox"].forEach(id=>{ const el=clone.querySelector("#"+id); if(el) el.innerHTML=""; });
  const lb = clone.querySelector("#lbImg"); if(lb) lb.setAttribute("src","");
  const t = clone.querySelector("#toast"); if(t){ t.textContent=""; t.classList.remove("show"); }
  const dataEl = clone.querySelector("#storeDataJSON"); if(dataEl) dataEl.textContent = json;
  return "<!DOCTYPE html>\n" + clone.outerHTML;
}
async function saveData(d){
  DATA = d;
  try{ const _j = JSON.stringify(d); if(_j.length < 4500000) LS.set("jfy_data", _j); }catch(e){}
  try{ if(window.jfyApplyAppIcons) await window.jfyApplyAppIcons(); }catch(e){}
  try{
    const artifact = await getArtifactCap();
    if(!artifact){
      // مفيش وصلة نشر متاحة (مثلاً بتجرب الملف محليًا) — البيانات محفوظة في هذا المتصفح فقط
      return;
    }
    const html = snapshotFullHTML(d);
    await artifact.publish(html);
    toast("تم حفظ التحديث ونشره لكل زوار رابط المتجر ✅");
  }catch(e){
    console.error(e);
    const code = e && e.code;
    if(code==="conflict"){
      // نسخة أحدث اتنشرت بالفعل؛ الصفحة هترجع تتحدث لوحدها
    } else if(code==="not_writer" || code==="not_granted"){
      toast("مفيش صلاحية نشر من هنا — افتح لوحة التحكم من رابط المتجر الأساسي اللي أنشأته Claude");
    } else {
      toast("تعذر نشر التحديث لكل الزوار الآن، هيتم حفظه في هذا المتصفح فقط وحاول تاني لاحقًا");
    }
  }
}

function money(n){ return Number(n||0).toLocaleString("ar-EG")+" جنيه"; }
/* ---- مقاسات وألوان المنتج (اختياري) ----
   p.sizes = [{size:"40", price:567}] ، p.colors = [{color:"أسود", price:567}]
   p.variants = [{size:"40", color:"أسود", price:567}]  (بس لو المنتج له مقاسات وألوان مع بعض: كل تركيبة بسعرها) */
function hasSizes(p){ return !!(p && Array.isArray(p.sizes) && p.sizes.length); }
function hasColors(p){ return !!(p && Array.isArray(p.colors) && p.colors.length); }
function hasOptions(p){ return hasSizes(p) || hasColors(p); }
function optLabel(p){ return (hasSizes(p)&&hasColors(p)) ? 'اختر المقاس واللون' : (hasColors(p) ? 'اختر اللون' : 'اختر المقاس'); }
function getVariants(p){
  if(!p || !hasOptions(p)) return [];
  if(Array.isArray(p.variants) && p.variants.length) return p.variants;
  const S = hasSizes(p) ? p.sizes : [null], C = hasColors(p) ? p.colors : [null], out = [];
  S.forEach(s=>C.forEach(c=>out.push({size: s?String(s.size):"", color: c?String(c.color):"",
    price: (s && s.price>0) ? s.price : ((c && c.price>0) ? c.price : p.price)})));
  return out;
}
function vPrice(p,v){ return v.price>0 ? v.price : p.price; }
function variantEntry(p,size,color){
  const z=String(size||""), c=String(color||"");
  return getVariants(p).find(v=>String(v.size||"")===z && String(v.color||"")===c);
}
function sizeEntry(p,size){ return hasSizes(p) ? p.sizes.find(s=>String(s.size)===String(size)) : null; }
function colorEntry(p,color){ return hasColors(p) ? p.colors.find(c=>String(c.color)===String(color)) : null; }
function allPrices(p){ const vs=getVariants(p); return vs.length ? vs.map(v=>vPrice(p,v)) : [Number(p.price)||0]; }
/* كود المنتج (جاي من ملف الإكسيل): p.code للمنتج العادي، و p.vcodes = [{size,color,code}] لكل مقاس/لون */
function codeFor(p,size,color){
  if(!p) return "";
  const z=String(size||""), c=String(color||"");
  if(Array.isArray(p.vcodes)){ const v=p.vcodes.find(x=>String(x.size||"")===z && String(x.color||"")===c); if(v && v.code) return String(v.code); }
  return p.code ? String(p.code) : "";
}
function unitPrice(p,size,color){ const v=variantEntry(p,size,color); return v ? vPrice(p,v) : p.price; }
function priceFrom(p){ return Math.min.apply(null,allPrices(p)); }
function priceVaries(p){ const a=allPrices(p); return Math.min.apply(null,a)!==Math.max.apply(null,a); }
function cartValid(c){
  const p=DATA.products.find(x=>x.id===c.id); if(!p) return false;
  if(!hasOptions(p)) return true;
  if(hasSizes(p) && !c.size) return false;
  if(hasColors(p) && !c.color) return false;
  return !!variantEntry(p,c.size,c.color);
}

function safeDecode(x){ try{ return decodeURIComponent(x); }catch(e){ return x; } }
/* فتح صفحة المنتج بيبدأ من فوق (من الصورة)، ولما العميل يرجع للقايمة بترجع لنفس المكان اللي كان واقف فيه */
let _jfyPrevHash = null; const _jfyListPos = {};
function route(){
  const h = location.hash || "#/";
  const prev = _jfyPrevHash, wasProduct = !!prev && prev.indexOf("#/product/") === 0, isProduct = h.indexOf("#/product/") === 0;
  if(prev && !wasProduct && prev.indexOf("#/admin") !== 0) _jfyListPos[prev] = window.scrollY || 0;   // مكان العميل في القايمة قبل ما يسيبها
  _jfyPrevHash = h;
  const r = _routeCore();
  try{
    if(isProduct) window.scrollTo(0, 0);
    else if(wasProduct && _jfyListPos[h] != null) window.scrollTo(0, _jfyListPos[h]);
  }catch(e){}
  return r;
}
function _routeCore(){
  const h = location.hash || "#/";
  if(h.startsWith("#/admin")) return renderAdmin();
  if(h.startsWith("#/product/")) return renderProduct(h.split("/")[2]);
  if(h.startsWith("#/category/")) return renderHome(h.split("/")[2]);
  if(h.startsWith("#/search/")) return renderHome(null, safeDecode(h.split("/")[2]||""));
  return renderHome();
}

function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function normAr(s){
  return String(s||"").toLowerCase().replace(/[\u064B-\u065F\u0670\u0640]/g,"")
    .replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/\s+/g," ").trim();
}
function allIconHTML(){

  if(a.image) return `<img src="${a.image}">`;

function delEmojiCfg(){

/* كارت المنتج: لو الصورة مش مربعة، الجوانب الفاضية بتتملي ببلور من روح الصورة نفسها (نسخة مغبّشة منها) بدل الأبيض أو لون ساده. الصور الشفافة (PNG) بتفضل زي ما هي */
function jfyCardBg(img){
  try{
    const t = img.parentNode;
    if(!t || !t.classList || !t.classList.contains("thumb")) return;
    if(t.querySelector(".jfy-blur")) return;
    const src = img.getAttribute("src")||"";
    if(/^data:image\/png/i.test(src) || /\.png(#.*)?$/i.test(src)) return;   // PNG شفاف: الإطار اللي اخترته (غامق/فاتح/بدون) هو اللي بيظهر
    const w = img.naturalWidth, h = img.naturalHeight; if(!w || !h) return;
    if(Math.abs(w/h-1) < 0.03) return;           // مربعة: مفيش فراغ
    try{   // لو حواف الصورة شفافة (مثلاً WebP شفاف) نسيبها شفافة
      const N = 16, c = document.createElement("canvas"); c.width = N; c.height = N;
      const x = c.getContext("2d"); x.drawImage(img, 0, 0, N, N);
      const d = x.getImageData(0, 0, N, N).data;
      if(d[3] < 250 || d[(N*N-1)*4+3] < 250) return;
    }catch(err){}
    const bl = document.createElement("img");
    bl.className = "jfy-blur"; bl.setAttribute("alt",""); bl.setAttribute("aria-hidden","true"); bl.src = src;
    t.insertBefore(bl, img);
  }catch(err){}
}
function quickAdd(id){

  if(hasOptions(p)){ location.hash="#/product/"+id; return; }   // منتج بمقاسات/ألوان: يفتح صفحته ليختار العميل المقاس/اللون
  addToCart(id,1); toast("تمت إضافة المنتج للسلة");
}

function doSearch(){
  const si=document.getElementById("searchInput"); if(!si) return;
  const v=si.value.trim();
  const target = v ? "#/search/"+encodeURIComponent(v) : "#/";
  const before = location.hash;
  location.hash = target;
  if(location.hash===before) route();   // نفس الكلمة مرة تانية: نحدّث النتائج يدويًا
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
}
function wireHeader(){
  const bs=document.getElementById("btnSearch");
  const sf=document.getElementById("searchBar");
  const si=document.getElementById("searchInput");
  const go=document.getElementById("searchGo");
  const sync=()=>{
    const has = !!(si && si.value.trim());
    if(go) go.classList.toggle("on", has);
    if(bs) bs.classList.toggle("lit", has);
  };
  if(si){ si.addEventListener("input", sync); sync(); }
  // البحث لا يبدأ إلا بالضغط على "بحث" أو Enter (كمبيوتر أو موبايل)
  if(sf) sf.addEventListener("submit",(e)=>{ e.preventDefault(); doSearch(); });
  if(bs) bs.onclick=()=>{
    if(!sf) return;
    const isOpen = sf.classList.contains("open");
    const typed = si ? si.value.trim() : "";
    if(isOpen && typed && typed!==(sf.dataset.applied||"")){ doSearch(); return; }
    sf.classList.toggle("open");
    if(sf.classList.contains("open") && si) si.focus();
  };
  renderCartBadge();   // العداد يفضل ظاهر طول ما فيه منتجات في السلة، في أي صفحة
  const bc=document.getElementById("btnCart"); if(bc) bc.onclick=openCart;
  const bl=document.getElementById("btnCopyLink"); if(bl) bl.onclick=copyStoreLink;
}

/* ---------- copy store link ---------- */
async function copyStoreLink(){
  const url = location.origin + location.pathname;
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(url);
      toast("تم نسخ رابط المتجر ✅");
      return;
    }
    throw new Error("no-clipboard-api");
  }catch(e){
    try{
      const ta=document.createElement("textarea");
      ta.value=url; ta.setAttribute("readonly","");
      ta.style.position="fixed"; ta.style.opacity="0"; ta.style.top="0"; ta.style.left="0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      const ok=document.execCommand("copy");
      document.body.removeChild(ta);
      if(ok) toast("تم نسخ رابط المتجر ✅");
      else window.prompt("انسخ رابط المتجر يدويًا:", url);
    }catch(e2){
      window.prompt("انسخ رابط المتجر يدويًا:", url);
    }
  }
}

function getVideos(p){

  if(Array.isArray(p.videos) && p.videos.length) return p.videos.filter(v=>typeof v==="string" && v.trim());
  return (typeof p.video==="string" && p.video.trim()) ? [p.video.trim()] : [];
}
/* روابط فيسبوك (فيديو عام فقط): بنحوّلها لمشغّل فيسبوك المدمج */
function fbHref(url){
  let u = String(url||"").trim().replace(/#jfy=[vh]$/,"");
  if(!/^https?:\/\//i.test(u)) u = "https://"+u.replace(/^\/+/,"");
  const m = u.match(/^https?:\/\/([^\/?#]+)/i); if(!m) return null;
  const host = m[1].toLowerCase().replace(/:\d+$/,"");
  if(!/(^|\.)(facebook\.com|fb\.watch|fb\.com)$/.test(host)) return null;
  if(/(^|\.)facebook\.com$/.test(host)) u = u.replace(/^(https?:\/\/)[^\/?#]+/i, "$1www.facebook.com");
  return u;
}
/* اتجاه فيديو فيسبوك: "v" طولي أو "h" عرضي. بيتحدد من اختيارك في لوحة التحكم (محفوظ مع الرابط)، ولو "تلقائي" بنعتمد على نوع الرابط (Reels/Stories = طولي) */
function fbMode(url){ const m=String(url||"").match(/#jfy=([vh])$/); return m ? m[1] : "a"; }
function fbOri(url){
  const m = fbMode(url); if(m!=="a") return m;
  return /facebook\.com\/(?:reels?|stories)\//i.test(url) || /facebook\.com\/share\/r\//i.test(url) ? "v" : "h";
}
function setFbOri(url, mode){ const base=String(url||"").replace(/#jfy=[vh]$/,""); return (mode==="v"||mode==="h") ? base+"#jfy="+mode : base; }
function fbSrc(href, ori){ return "https://www.facebook.com/plugins/video.php?href="+encodeURIComponent(href)+"&show_text=false&autoplay=true&allowfullscreen=true&"+(ori==="v" ? "width=360&height=640" : "width=560"); }
function ytId(url){
  if(!/youtu\.?be/.test(url)) return null;
  const m = url.match(/[?&]v=([\w-]{6,})/) || url.match(/youtu\.be\/([\w-]{6,})/) || url.match(/youtube\.com\/(?:shorts|embed|live)\/([\w-]{6,})/);
  return m ? m[1] : "";
}
/* الفيديو داخل صفحة المنتج: تشغيل تلقائي ومستمر (بدون صوت) والضغط عليه يكبّره */
/* ---- أدوات مشتركة للفيديو: الاتجاه (تلقائي/طولي/عرضي) محفوظ مع الرابط أو الفيديو كـ #jfy=v|h ---- */
function vidBase(u){ return String(u||"").replace(/#jfy=[vh]$/,""); }
/* إنستجرام: بنحوّل رابط الريل/البوست لمشغّل إنستجرام المدمج (للحسابات العامة فقط) */
function igInfo(url){
  const u = vidBase(url).trim();
  const m = u.match(/^(?:https?:\/\/)?(?:[\w-]+\.)*(?:instagram\.com|instagr\.am)\/(?:(?!share\/)[\w.]+\/)?(reels?|p|tv)\/([\w-]{5,})/i);
  if(m){ const t = m[1].toLowerCase(); return {type: t==="reels" ? "reel" : t, code: m[2]}; }
  return /^(?:https?:\/\/)?(?:[\w-]+\.)*(?:instagram\.com|instagr\.am)(?:[\/?#]|$)/i.test(u) ? {bad:true} : null;
}
function igEmbedSrc(ig){
  /* نفس بارامترات كود التضمين الرسمي من إنستجرام (cr/v/wp/rd) عشان المشغّل يعرف الصفحة اللي مضمّن فيها وبيشتغل صح خصوصًا الريلز الطولي */
  let q = "?cr=1&v=14&wp=" + (ig.type==="reel" ? 400 : 540);
  try{ if(/^https?:$/.test(location.protocol)) q += "&rd=" + encodeURIComponent(location.origin) + "&rp=" + encodeURIComponent(location.pathname + location.search); }catch(err){}
  return "https://www.instagram.com/"+ig.type+"/"+ig.code+"/embed/"+q;
}
function vidOri(url){   /* "v" طولي | "h" عرضي | "a" تلقائي (للملفات: بنسبته الأصلية) */
  const m = fbMode(url); if(m!=="a") return m;
  const b = vidBase(url);
  if(fbHref(b)) return fbOri(b);
  const ig = igInfo(b); if(ig && !ig.bad) return ig.type==="reel" ? "v" : "a";
  if(/youtube\.com\/shorts\//i.test(b)) return "v";
  return "a";
}
function igCls(url){
  const ig = igInfo(vidBase(url)), o = vidOri(url);
  if(o==="h") return "igh";
  if(o==="v") return "";
  return (ig && !ig.bad && ig.type!=="reel") ? "igp" : "";
}
function igFrameHTML(ig){
  return `<div class="ig-wrap"><iframe title="فيديو إنستجرام" src="${igEmbedSrc(ig)}" data-src="${igEmbedSrc(ig)}" allow="autoplay; encrypted-media; fullscreen; picture-in-picture; clipboard-write" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" scrolling="no" frameborder="0" allowtransparency="true"></iframe></div>`;
}
/* إنستجرام: إعادة تحميل الإطار بترجّعه لحالة "اضغط للتشغيل" وبتوقف صوته (للتشغيل أكتر من مرة) */
let _igActive = null;   // آخر فيديو إنستجرام اتشغّل
function igReload(f){
  try{
    const u = f.getAttribute("data-src") || f.getAttribute("src"); if(!u) return;
    if(_igActive===f) _igActive = null;
    f._used = 0; const t = (f._rt = (f._rt||0) + 1);
    f.src = "about:blank";                                  // بيقطع الصوت فورًا
    setTimeout(()=>{ if(f._rt===t) f.src = u; }, 80);       // وبيرجّع الفيديو لحالة "اضغط للتشغيل"
  }catch(err){}
}
function igReplay(btn){ const c = btn.closest(".pd-video, #lbVideoBox"); const f = c && c.querySelector(".ig-wrap iframe"); if(f) igReload(f); }
/* لما العميل يشغّل فيديو إنستجرام تاني: بنقفل اللي قبله عشان الأصوات ما تتداخلش (بنراقب انتقال التركيز لإطار تاني) */
let _igLastFocus = null;
function igFocusWatch(){
  const a = document.activeElement;
  if(!a || a.tagName!=="IFRAME" || !a.closest || !a.closest(".ig-wrap")){ _igLastFocus = null; return; }
  if(a===_igLastFocus) return;
  _igLastFocus = a;
  const prev = _igActive;
  _igActive = a; a._used = 1;
  if(prev && prev!==a && prev.isConnected) igReload(prev);   // فيديو تاني اتشغّل: بنوقف اللي قبله
}
window.addEventListener("blur", ()=>{ setTimeout(igFocusWatch,0); });
setInterval(()=>{ if(!document.hidden) igFocusWatch(); }, 300);
/* فتح التكبير: بنوقف مؤقتًا الفيديوهات الصغيرة (إنستجرام/فيسبوك) عشان يفضل صوت واحد بس، وبنرجّعها لما نقفل */
let _parked = [];
function parkInline(){
  if(_parked.length) return;
  _igActive = null; _igLastFocus = null;
  document.querySelectorAll("#app .pd-video iframe").forEach(f=>{
    if(/youtube\.com/.test(f.getAttribute("src")||"") || !f.parentNode) return;
    const ph = document.createComment("parked"); f.parentNode.replaceChild(ph, f); _parked.push({ph:ph, f:f});
  });
}
function unparkInline(){
  const list = _parked; _parked = [];
  list.forEach(o=>{ if(o.ph.parentNode){ o.f._used=0; o.f._rt=(o.f._rt||0)+1; const du=o.f.getAttribute("data-src"); if(du) o.f.setAttribute("src", du); o.ph.parentNode.replaceChild(o.f, o.ph); } });
}
/* إنستجرام بيبعت ارتفاع المحتوى الفعلي: بنظبط الإطار عليه عشان الفيديو يظهر كامل بدون قص */
window.addEventListener("message", (e)=>{
  try{
    if(!/(^|\.)instagram\.com$/.test(new URL(e.origin).hostname)) return;
    let d = e.data; if(typeof d==="string") d = JSON.parse(d);
    if(!d || d.type!=="MEASURE" || !d.details || !(d.details.height>0)) return;
    document.querySelectorAll(".ig-wrap iframe").forEach(f=>{

  if(_vidIO){ try{ _vidIO.disconnect(); }catch(err){} } _visVids.clear();

function jfyGallerySwipe(){

  const p = DATA.products.find(x=>x.id===GALLERY_PID); if(!p || !p.images || p.images.length < 2) return;
  const getImg = ()=>document.getElementById("galMainImg");

  const snap = ()=>{ const im = getImg(); if(im){ im.style.transition = "transform .18s ease-out"; im.style.transform = ""; } };
  box.addEventListener("pointerdown", (e)=>{
    if(e.pointerType === "mouse" || pid !== null || GZ.s > 1.04) return;

  LBZ.x = Math.min(mx, Math.max(-mx, LBZ.x)); LBZ.y = Math.min(my, Math.max(-my, LBZ.y));
}
function lbSetScale(ns, px, py){
  const img = document.getElementById("lbImg"); if(!img) return;
  ns = Math.min(LBZ.max, Math.max(LBZ.min, ns)); if(ns<1.04) ns = 1;
  const r = ns/LBZ.s; if(r===1) return;
  const b = img.getBoundingClientRect();
  if(px===undefined || px===null){ px = window.innerWidth/2; py = window.innerHeight/2; }
  LBZ.x += (px-(b.left+b.width/2))*(1-r); LBZ.y += (py-(b.top+b.height/2))*(1-r);
  LBZ.s = ns; lbClamp(); lbApply();
}
function lbZoomReset(){ LBZ.s=1; LBZ.x=0; LBZ.y=0; lbApply(); }
(function(){
  const img = document.getElementById("lbImg"), lb = document.getElementById("lightbox");
  img.draggable = false;
  document.getElementById("lbZoomIn").onclick = (e)=>{ e.stopPropagation(); lbSetScale(LBZ.s*1.5); };
  document.getElementById("lbZoomOut").onclick = (e)=>{ e.stopPropagation(); lbSetScale(LBZ.s/1.5); };
  const ptrs = new Map(); let pinch = null, drag = null;
  img.addEventListener("pointerdown", (e)=>{
    if(LB_MODE!=="img") return;
    try{ img.setPointerCapture(e.pointerId); }catch(err){}
    ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(ptrs.size===1){ drag = {x:e.clientX, y:e.clientY, tx:LBZ.x, ty:LBZ.y}; }
    else if(ptrs.size===2){ const v=[...ptrs.values()]; pinch = {d:Math.hypot(v[0].x-v[1].x, v[0].y-v[1].y)||1, s:LBZ.s}; drag = null; }
  });
  img.addEventListener("pointermove", (e)=>{
    if(!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(ptrs.size>=2 && pinch){
      const v=[...ptrs.values()]; const d=Math.hypot(v[0].x-v[1].x, v[0].y-v[1].y);
      lbSetScale(pinch.s*d/pinch.d, (v[0].x+v[1].x)/2, (v[0].y+v[1].y)/2);
    } else if(ptrs.size===1 && drag && LBZ.s>1){
      LBZ.x = drag.tx+(e.clientX-drag.x); LBZ.y = drag.ty+(e.clientY-drag.y); lbClamp(); lbApply();
    }
  });
  const up = (e)=>{
    ptrs.delete(e.pointerId);
    if(ptrs.size<2) pinch = null;
    if(ptrs.size===1){ const p=[...ptrs.values()][0]; drag = {x:p.x, y:p.y, tx:LBZ.x, ty:LBZ.y}; }
    else if(!ptrs.size) drag = null;
  };
  img.addEventListener("pointerup", up); img.addEventListener("pointercancel", up);
  img.addEventListener("dblclick", (e)=>{ e.stopPropagation(); if(LBZ.s>1) lbZoomReset(); else lbSetScale(2.5, e.clientX, e.clientY); });
  lb.addEventListener("wheel", (e)=>{
    if(LB_MODE!=="img" || !lb.classList.contains("open")) return;
    e.preventDefault(); lbSetScale(LBZ.s*(e.deltaY<0 ? 1.15 : 1/1.15), e.clientX, e.clientY);
  }, {passive:false});
  window.addEventListener("resize", ()=>{ lbClamp(); lbApply(); });
})();

function hasTransparency(ctx, w, h){
  try{
    if(!w || !h) return false;
    const d = ctx.getImageData(0,0,w,h).data;
    for(let i=3;i<d.length;i+=4){ if(d[i]<250) return true; }
  }catch(e){}
  return false;
}
/* لو الصورة فيها شفافية: نخلّي المستخدم يختار (PNG بشفافية) أو (خلفية بيضاء) — واحدة واحدة بالدور */
let _imgChoiceChain = Promise.resolve();
function askTransparentChoice(canvas, cb, frame){
  _imgChoiceChain = _imgChoiceChain.then(()=>new Promise(done=>{
    const png = canvas.toDataURL("image/png");
    const pngLight = png.replace("data:image/png;base64,","data:image/png;jfybg=l;base64,");

    const wc = document.createElement("canvas"); wc.width = canvas.width; wc.height = canvas.height;
    const wx = wc.getContext("2d"); wx.fillStyle = "#fff"; wx.fillRect(0,0,wc.width,wc.height); wx.drawImage(canvas,0,0);
    const jpg = wc.toDataURL("image/jpeg",0.82);
    const kb = u => { const k = Math.round(u.length*0.75/1024); return k>=1024 ? (k/1024).toFixed(1)+" MB" : k+" KB"; };
    const sz = u => `الحجم حوالي <bdi dir="ltr">${kb(u)}</bdi>`;
    const opts = {};

      html += `<button type="button" class="tc-opt" data-k="light"><div class="tc-prev lgt"><img src="${png}" alt=""></div><b>PNG شفاف — إطار فاتح</b><small>يحافظ على الشفافية — ${sz(png)}</small></button>`;
      html += `<button type="button" class="tc-opt" data-k="none"><div class="tc-prev nob"><img src="${png}" alt=""></div><b>بدون خلفية خالص</b><small>المنتج لوحده طايز من غير أي إطار — ${sz(png)}</small></button>`;
    }else{
      opts.dark = png;
      html += `<button type="button" class="tc-opt" data-k="dark"><div class="tc-prev chk"><img src="${png}" alt=""></div><b>PNG بخلفية شفافة</b><small>يحافظ على الشفافية — ${sz(png)}</small></button>`;
    }
    opts.white = jpg;
    html += `<button type="button" class="tc-opt" data-k="white"><div class="tc-prev wht"><img src="${jpg}" alt=""></div><b>خلفية بيضاء</b><small>تتحفظ JPEG — ${sz(jpg)}</small></button>`;
    const ov = document.createElement("div"); ov.className = "tc-ov"; ov.setAttribute("role","dialog");
    ov.innerHTML = `<div class="tc-box"><h3>الصورة دي فيها خلفية شفافة</h3><p>${frame?"اختار طريقة الحفظ ولون الإطار اللي هيظهر ورا الصورة في المتجر (أو بدون خلفية خالص):":"اختار طريقة الحفظ المناسبة:"}</p><div class="tc-opts">${html}</div></div>`;
    ov.querySelectorAll(".tc-opt").forEach(btn=>btn.addEventListener("click",()=>{
      const url = opts[btn.getAttribute("data-k")];
      ov.remove();
      try{ cb(url); }catch(err){ console.error(err); }
      done();
    }));
    document.body.appendChild(ov);
  }));
}
function resizeImage(file, maxDim, cb, onFail, frame){
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      let {width:w, height:h} = img;
      if(w>h && w>maxDim){ h=h*maxDim/w; w=maxDim; } else if(h>maxDim){ w=w*maxDim/h; h=maxDim; }
      const canvas=document.createElement("canvas"); canvas.width=w; canvas.height=h;
      const ctx = canvas.getContext("2d"); ctx.drawImage(img,0,0,w,h);
      if(file.type!=="image/jpeg" && hasTransparency(ctx, canvas.width, canvas.height)){ askTransparentChoice(canvas, cb, frame); return; }
      cb(canvas.toDataURL("image/jpeg",0.82));
    };
    img.onerror=()=>{ toast("تعذر قراءة الصورة"); if(onFail) onFail(); };
    img.src = e.target.result;
  };
  reader.onerror=()=>{ toast("فشل رفع الصورة"); if(onFail) onFail(); };
  reader.readAsDataURL(file);
}

/* ================= ADMIN ================= */
async function sha256(str){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
const hex = (u8)=>Array.from(u8).map(b=>b.toString(16).padStart(2,"0")).join("");
const unhex = (h)=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
async function pbkdf2(str, salt){
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(str), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", salt, iterations:150000}, key, 256);
  return new Uint8Array(bits);
}
async function hashPass(str){           // تشفير مملّح للكلمات الجديدة
  const salt = crypto.getRandomValues(new Uint8Array(16));
  return "pbkdf2$"+hex(salt)+"$"+hex(await pbkdf2(str, salt));
}
async function checkPass(str, stored){  // يدعم الصيغة القديمة (SHA-256) والجديدة
  if(!stored) return false;
  if(stored.startsWith("pbkdf2$")){
    const [,saltHex,hashHex] = stored.split("$");
    return hex(await pbkdf2(str, unhex(saltHex))) === hashHex;
  }
  return (await sha256(str)) === stored;
}
async function verifyOne(val, kind){
  const list = customHashes(kind);
  if(!list.length) return {ok: (await sha256(val))===(kind==="user" ? DEFAULT_USER_HASH : DEFAULT_ADMIN_HASH), custom:false};
  for(const h of list){ if(await checkPass(val,h)) return {ok:true, custom:true}; }
  return {ok:false, custom:true};
}
async function verifyAdmin(user, pass){
  const [u,p] = await Promise.all([verifyOne(normUser(user),"user"), verifyOne(pass,"pass")]);
  return {ok: u.ok && p.ok, userCustom:u.custom, passCustom:p.custom};
}

  const m=document.getElementById("adminMain");
  m.innerHTML = `
    <div class="admin-row" style="flex-direction:column;align-items:flex-start;gap:10px">
      <b>تحديث المنتجات والتصنيفات من ملف إكسل</b>
      <p style="color:var(--muted);font-size:12.5px;margin:0;line-height:1.8">
        ارفع نفس ملف إكسل بتاعك (نفس تنسيق شيت "تسعير المنتجات" وشيت "Lists"). النظام بيقرأ منه فقط (Read-Only) ولا يعدّل أي شيء داخل الملف نفسه.<br>
        • المنتج اللي اسمه موجود بالفعل في المتجر: هيتحدث سعره وتصنيفه فقط (صوره ووصفه هيفضلوا زي ما هما).<br>
        • المنتج الجديد: هيتضاف تلقائيًا (تقدر تضيفله صور بعدين من تبويب المنتجات).<br>
        • المنتج اللي له مقاسات و/أو ألوان في الإكسيل (عمودا "المقاس" و"اللون" في شيت تسعير المنتجات) بيتضاف كمنتج واحد، والعميل بيختار المقاس واللون من صفحة المنتج.<br>
        • مفيش أي منتج بيتحذف تلقائيًا من المتجر.
      </p>
      <div class="upload-box" style="width:100%"><input type="file" id="excelFile" accept=".xlsx,.xls"></div>
      <div id="excelStatus" style="font-size:12.5px;color:var(--copper);font-weight:700"></div>
    </div>
  `;
  document.getElementById("excelFile").onchange=(e)=>{ if(e.target.files[0]) handleExcelFile(e.target.files[0]); };
}
async function handleExcelFile(file){
  const status=document.getElementById("excelStatus");
  status.textContent="جاري القراءة...";
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:"array"});
    const prodSheetName = wb.SheetNames.find(n=>n.includes("تسعير")) || wb.SheetNames.find(n=>n.includes("منتج"));
    if(!prodSheetName){ status.textContent="لم يتم العثور على شيت المنتجات (تسعير المنتجات) في هذا الملف."; return; }
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[prodSheetName], {header:1, defval:null});
    let headerIdx=-1, colName=-1, colCat=-1, colPrice=-1, colSize=-1, colColor=-1, colCode=-1;
    for(let i=0;i<Math.min(rows.length,8);i++){
      const row = rows[i]||[];
      const ni = row.findIndex(c=>String(c||"").trim()==="اسم المنتج");
      if(ni>-1){
        headerIdx=i; colName=ni;
        colCat = row.findIndex(c=>String(c||"").trim()==="الكاتيجري");
        colPrice = row.findIndex(c=>String(c||"").includes("سعر البيع"));
        colSize = row.findIndex(c=>String(c||"").trim().startsWith("المقاس"));
        colColor = row.findIndex(c=>String(c||"").trim().startsWith("اللون"));
        colCode = row.findIndex(c=>{ const t=String(c||"").trim(); return t.includes("كود") || /^(sku|code|product code|barcode)$/i.test(t); });
        break;
      }
    }
    if(headerIdx===-1){ status.textContent="تعذر التعرف على أعمدة شيت المنتجات — تأكد إن الملف بنفس تنسيق الأصلي."; return; }
    const catIconMap = {"كوتشيات":"👟","شنط":"👜","ساعات":"⌚","محافظ":"👝","اكسسوارات":"💍","إكسسوارات":"💍","نظارات":"🕶️"};
    let newCats=0, newProds=0, updProds=0;
    function ensureCat(name){
      name=String(name||"").trim(); if(!name) return null;
      let c = DATA.categories.find(x=>x.name===name);
      if(!c){ c={id:"c"+Date.now()+Math.floor(Math.random()*999), name, icon:catIconMap[name]||"🏷️", image:null};
        DATA.categories.push(c); newCats++; }
      return c.id;
    }
    // شيل الجزء الأخير من الاسم لو هو المقاس أو اللون: "كوتشي موديل A - 40 - أسود" ← "كوتشي موديل A"
    function stripTail(full,val){
      const t=String(full).trim(), z=String(val).trim();
      if(!z || t.length<=z.length || t.slice(-z.length).toLowerCase()!==z.toLowerCase()) return t;
      let x=t.slice(0,t.length-z.length).trim();
      if(x.endsWith("-")) x=x.slice(0,-1).trim();
      return x||t;
    }
    function baseName(full,size,color){
      let t=String(full).trim();
      for(let k=0;k<2;k++){
        const before=t;
        if(color) t=stripTail(t,color);
        if(t===before && size) t=stripTail(t,size);
        if(t===before) break;
      }
      return t;
    }
    const minPos = arr => { const a=arr.filter(x=>x>0); return a.length ? Math.min.apply(null,a) : 0; };
    const groups=[], gmap={};
    for(let i=headerIdx+1;i<rows.length;i++){
      const row=rows[i]||[];
      const name=row[colName];
      if(!name || !String(name).trim()) continue;
      const catName = colCat>-1? row[colCat] : null;
      const price = colPrice>-1? (parseFloat(row[colPrice])||0) : 0;
      const catId = ensureCat(catName) || (DATA.categories[0] && DATA.categories[0].id);
      const full = String(name).trim();
      const size = (colSize>-1 && row[colSize]!=null) ? String(row[colSize]).trim() : "";
      const color = (colColor>-1 && row[colColor]!=null) ? String(row[colColor]).trim() : "";
      const code = (colCode>-1 && row[colCode]!=null) ? String(row[colCode]).trim() : "";
      const base = (size||color) ? baseName(full,size,color) : full;
      let g = gmap[base];
      if(!g){ g={name:base, catId, price, variants:[], fulls:[], vc:[], code:""}; gmap[base]=g; groups.push(g); }
      if(size||color){
        if(!g.variants.some(v=>v.size===size && v.color===color)) g.variants.push({size, color, price});
        if(code){ const ev=g.vc.find(v=>v.size===size && v.color===color); if(ev){ if(!ev.code) ev.code=code; } else g.vc.push({size, color, code}); }
        g.fulls.push(full);
      }
      else { g.price = price; if(code) g.code = code; }
    }
    let sized=0, merged=0, incomplete=0;
    groups.forEach(g=>{
      if(g.variants.length){
        g.price = minPos(g.variants.map(v=>v.price)) || g.price;
        g.variants.forEach(v=>{ if(!(v.price>0)) v.price=g.price; });
        const sizeList=[], colorList=[];
        g.variants.forEach(v=>{ if(v.size && !sizeList.includes(v.size)) sizeList.push(v.size); if(v.color && !colorList.includes(v.color)) colorList.push(v.color); });
        g.sizes = sizeList.map(z=>({size:z, price:minPos(g.variants.filter(v=>v.size===z).map(v=>v.price)) || g.price}));
        g.colors = colorList.map(c=>({color:c, price:minPos(g.variants.filter(v=>v.color===c).map(v=>v.price)) || g.price}));
        // لو الموديل له مقاسات وألوان: كل صف لازم يكون فيه الاتنين، وإلا الصف ده مش هيتعرض
        incomplete += g.variants.filter(v=>(sizeList.length && !v.size) || (colorList.length && !v.color)).length;
        // منتجات اتسجلت قبل كده كل مقاس/لون منها كمنتج مستقل: بتتدمج في المنتج الواحد
        const before=DATA.products.length;
        DATA.products = DATA.products.filter(p=>!(p.fromExcel && g.fulls.includes(String(p.name).trim())));
        merged += before-DATA.products.length; sized++;
      }
      const existing = DATA.products.find(p=>p.name.trim()===g.name);
      const applyOpts = (o)=>{
        if(!g.variants.length) return;
        if(g.sizes.length) o.sizes=g.sizes; else delete o.sizes;
        if(g.colors.length) o.colors=g.colors; else delete o.colors;
        if(g.sizes.length && g.colors.length) o.variants=g.variants; else delete o.variants;
      };
      const applyCodes = (o)=>{
        if(colCode===-1) return;   // مفيش عمود كود في الإكسيل: سيب أي أكواد موجودة زي ما هي
        if(g.code) o.code=g.code; else delete o.code;
        if(g.vc.length) o.vcodes=g.vc; else delete o.vcodes;
      };
      if(existing){ existing.cat=g.catId; existing.price=g.price; existing.demo=false; applyOpts(existing); applyCodes(existing); updProds++; }
      else{
        const np={id:"p"+Date.now()+Math.floor(Math.random()*999), name:g.name, cat:g.catId, price:g.price, desc:"", images:[], video:"", demo:false, fromExcel:true};
        applyOpts(np); applyCodes(np);
        DATA.products.push(np); newProds++;
      }
    });
    saveData(DATA);
    status.textContent = `تم الاستيراد بنجاح: ${newProds} منتج جديد، ${updProds} منتج تم تحديثه، ${newCats} تصنيف جديد.` + (sized? ` (${sized} منتج بمقاسات/ألوان${merged? "، ودمجنا "+merged+" منتج كانوا مسجلين قبل كده كمنتجات منفصلة":""})`:"") + (colCode===-1? ` ⚠ مفيش عمود "كود" في شيت المنتجات، فمش هيظهر كود في رسالة الواتساب.`:"") + (incomplete? ` ⚠ فيه ${incomplete} صف ناقص المقاس أو اللون في موديل له مقاسات وألوان — الصفوف دي مش هتظهر للعميل، كمّل بياناتها في الإكسيل.`:"");
    toast("تم تحديث بيانات المتجر من الإكسل");
  }catch(e){
    console.error(e);
    status.textContent="حدث خطأ أثناء قراءة الملف. تأكد أنه ملف Excel صالح وبنفس تنسيق الملف الأصلي.";
  }
}

    DATA.products.map(p=>`<div class="admin-row">

function deleteProduct(id){
  if(!confirm("تأكيد حذف المنتج؟")) return;
  DATA.products = DATA.products.filter(p=>p.id!==id); saveData(DATA); renderAdminProducts();
}

    <div class="field"><label>الألوان — اختياري (اكتبها مفصولة بفاصلة، مثال: أسود, أبيض, بيج)</label><input id="pfColors" value="${escapeHtml((p.colors||[]).map(z=>z.color).join(', '))}"></div>
    <div class="field"><label>الوصف</label><textarea id="pfDesc" rows="3">${escapeHtml(p.desc||"")}</textarea></div>

    </div>
    <div class="field"><label>صور المنتج (يمكن اختيار أكثر من صورة)</label>
      <div class="img-thumbs" id="pfImgs">${renderImgThumbs()}</div>
      <div class="upload-box"><input type="file" id="pfUpload" accept="image/*" multiple></div>
    </div>
    <div class="field"><label>شكل الصورة في كارت المنتج (للصور الشفافة PNG)</label>

        <option value="white" ${p.thumbBg==='none'?'':'selected'}>خلفية الكارت البيضاء (زي الوضع الحالي)</option>

  document.getElementById("pfVideo").onkeydown = (e)=>{ if(e.key==="Enter"){ e.preventDefault(); addVideoUrl(); } };

}
function renderImgThumbs(){
  return (window._editingImages||[]).map((im,i)=>`<div class="it"><img src="${im}"><button onclick="removeEditingImg(${i})">✕</button></div>`).join("");
}
function removeEditingImg(i){ window._editingImages.splice(i,1); document.getElementById("pfImgs").innerHTML=renderImgThumbs(); }
/* حد حجم بيانات المتجر كاملة (صور + فيديوهات + نصوص) عشان النشر يفضل شغال: ملف النشر أقصاه 16MB */
/* داخل Claude (النشر كـ Artifact) الحد 16MB فنفضل على 15.5 مليون. خارج Claude (الموقع على GitHub أو أي استضافة): الحد 23.5 مليون حرف ≈ 22.5MB للملف، يعني تحت حد رفع GitHub من المتصفح (25MB) بهامش أمان */
function storeMax(){ return (window.claude && typeof window.claude.use === "function") ? 15500000 : 150000000; }   /* خارج Claude: الحفظ بنسخة GitHub (ZIP) فمفيش حد حجم عملي، ده بس سقف أمان لذاكرة المتصفح */
function storeRoomChars(){   // المساحة المتبقية للمنتج اللي بيتعدّل (بالحروف)
  const old = window._editingOld ? JSON.stringify(window._editingOld).length : 0;
  let baseLen;
  if(jfyBlobMode()){ if(window._jfyBaseRef !== DATA){ window._jfyBaseRef = DATA; window._jfyBaseLen = JSON.stringify(DATA).length; } baseLen = window._jfyBaseLen; }
  else baseLen = JSON.stringify(DATA).length;
  const base = baseLen - old;
  const sum = a => (a||[]).reduce((t,x)=>t+String(x).length+3,0);
  return storeMax() - base - sum(window._editingImages) - sum(window._editingVideos) - 8000;
}
function maxUploadMB(){ return Math.max(0, Math.floor((storeRoomChars()-40)/4*3/104857.6)/10); }
function vidRoomText(){ if(jfyBlobMode()) return "أقصى حجم للفيديو الواحد من الجهاز: 95 MB — بيتحفظ كملف منفصل، وبتنزّله مع «نسخة GitHub (ZIP)» من تبويب الشعار والإعدادات. للفيديوهات الأكبر استخدم رابط"; const m=maxUploadMB(); return m>0 ? ("أقصى حجم لفيديو تقدر ترفعه من الجهاز دلوقتي: حوالي "+m.toFixed(1)+" MB — للفيديوهات الأكبر استخدم رابط") : "مفيش مساحة كافية لرفع فيديو من الجهاز — استخدم رابط فيديو أو احذف صور/فيديوهات"; }
function videoDataLen(arr){ return (arr||[]).reduce((s,v)=>s+((typeof v==="string" && v.indexOf("data:")===0)?v.length:0),0); }
function renderVidList(){
  return (window._editingVideos||[]).map((v,i)=>{
    const isBlob = v.indexOf("blob:")===0; const isData = v.indexOf("data:")===0 || isBlob;
    const shown = isData ? v : vidBase(v);
    const label = isData ? ("🎬 فيديو من الجهاز ("+(isBlob ? ((JFY_BLOBS.get(vidBase(v))||{file:{size:0}}).file.size/1048576) : (v.length*0.75/1048576)).toFixed(1)+" MB)") : shown;
    const ig = isData ? null : igInfo(v);
    const mode = (ig && ig.bad) ? null : fbMode(v);
    const sel = mode ? `<select title="اتجاه الفيديو" onchange="setVidOri(${i},this.value)"><option value="a"${mode==="a"?" selected":""}>تلقائي</option><option value="v"${mode==="v"?" selected":""}>طولي</option><option value="h"${mode==="h"?" selected":""}>عرضي</option></select>` : "";
    return `<div class="vi"><span class="vn" title="${isData?'':escapeHtml(shown)}">${isData?label:escapeHtml(label)}</span>${sel}<button type="button" onclick="removeEditingVid(${i})">✕</button></div>`;
  }).join("");
}
function refreshVidList(){ const el=document.getElementById("pfVids"); if(el) el.innerHTML=renderVidList(); const r=document.getElementById("pfVidRoom"); if(r) r.textContent=vidRoomText(); }
function removeEditingVid(i){ window._editingVideos.splice(i,1); refreshVidList(); }
function addVideoUrl(){
  const inp=document.getElementById("pfVideo"); if(!inp) return;
  const raw=inp.value.trim(); if(!raw){ toast("اكتب أو الصق رابط الفيديو أولًا"); return; }
  { const ig = igInfo(raw); if(ig && ig.bad){ toast("رابط إنستجرام ده مش مدعوم — استخدم رابط الريل أو البوست نفسه (instagram.com/reel/... أو instagram.com/p/...)"); return; } }
  const u = withVidOri(raw);
  window._editingVideos=window._editingVideos||[];
  if(window._editingVideos.includes(u)){ toast("الرابط ده مضاف بالفعل"); return; }
  window._editingVideos.push(u); inp.value=""; syncVidOriSel(); refreshVidList();
}
/* اتجاه فيديو فيسبوك: قائمة الاختيار بتظهر بس لما الرابط يكون فيسبوك */
function withVidOri(u){ const sel=document.getElementById("pfVideoOri"); return sel ? setFbOri(u, sel.value) : u; }
function syncVidOriSel(){
  const inp=document.getElementById("pfVideo"), sel=document.getElementById("pfVideoOri"); if(!inp||!sel) return;
  const has = inp.value.trim()!=="";
  sel.style.display = has ? "" : "none"; if(!has) sel.value="a";
}
function setVidOri(i, mode){
  const arr = window._editingVideos||[]; if(typeof arr[i]!=="string") return;
  arr[i] = setFbOri(arr[i], mode); refreshVidList();
}
function handleVideoFiles(files, mode){
  const tooBig = (name, mb) => toast("الفيديو ("+name+") أكبر من المساحة المتاحة"+(mb!==null?" ("+mb.toFixed(1)+" MB)":"")+" — استخدم رابط فيديو أو قلّل حجمه أو احذف صور/فيديوهات");
  [...files].forEach(f=>{
    if(!/^video\//.test(f.type)){ toast("الملف ده مش فيديو: "+f.name); return; }
    if(jfyBlobMode() && window.URL && URL.createObjectURL){   // خارج Claude: الفيديو بيتحفظ كملف منفصل (من غير حد لحجم الملف الواحد غير حد GitHub)
      if(f.size > JFY_MAX_GH_FILE){ toast("الفيديو ("+f.name+") أكبر من 95MB وGitHub مش بيقبل ملف بالحجم ده — استخدم رابط يوتيوب أو فيسبوك أو إنستجرام"); return; }
      window._editingVideos = window._editingVideos||[];
      const bu = URL.createObjectURL(f); JFY_BLOBS.set(bu, {file:f, name:f.name});
      window._editingVideos.push((mode==="v"||mode==="h") ? bu+"#jfy="+mode : bu); refreshVidList(); return;
    }
    if(Math.ceil(f.size/3)*4 + 60 > storeRoomChars()){ tooBig(f.name, maxUploadMB()); return; }   // رفض فوري قبل قراءة الملف
    const fr=new FileReader();
    fr.onload=()=>{
      window._editingVideos=window._editingVideos||[];
      if(fr.result.length + 12 > storeRoomChars()){ tooBig(f.name, maxUploadMB()); return; }   // إعادة فحص (لو اتختار أكتر من فيديو مع بعض)
      window._editingVideos.push((mode==="v"||mode==="h") ? fr.result+"#jfy="+mode : fr.result); refreshVidList();
    };
    fr.onerror=()=>toast("تعذر قراءة الفيديو: "+f.name);
    fr.readAsDataURL(f);
  });
}
function saveProductForm(id, isEdit){
  const name = document.getElementById("pfName").value.trim();
  if(!name){ toast("أدخل اسم المنتج"); return; }
  const newPrice = parseFloat(document.getElementById("pfPrice").value)||0;
  const oldP = isEdit ? (DATA.products.find(x=>x.id===id)||{}) : {};
  const keepOwn = priceVaries(oldP);   // لو أسعار المقاسات مختلفة نحافظ عليها، وإلا كل المقاسات ياخدوا السعر الجديد
  const parseList = id => document.getElementById(id).value.split(/[,،]/).map(z=>z.trim()).filter(Boolean).filter((z,i,a)=>a.indexOf(z)===i);
  const sizeList = parseList("pfSizes"), colorList = parseList("pfColors");
  const minOf = arr => Math.min.apply(null,arr);
  let sizes=[], colors=[], variants=null;
  if(sizeList.length && colorList.length){
    variants=[];
    sizeList.forEach(z=>colorList.forEach(c=>{ const e = keepOwn ? (variantEntry(oldP,z,c) || sizeEntry(oldP,z) || colorEntry(oldP,c)) : null; variants.push({size:z, color:c, price:(e && e.price>0) ? e.price : newPrice}); }));
    sizes = sizeList.map(z=>({size:z, price:minOf(variants.filter(v=>v.size===z).map(v=>v.price))}));
    colors = colorList.map(c=>({color:c, price:minOf(variants.filter(v=>v.color===c).map(v=>v.price))}));
  } else {
    sizes = sizeList.map(z=>{ const e = keepOwn ? sizeEntry(oldP,z) : null; return {size:z, price:(e && e.price>0) ? e.price : newPrice}; });
    colors = colorList.map(c=>{ const e = keepOwn ? colorEntry(oldP,c) : null; return {color:c, price:(e && e.price>0) ? e.price : newPrice}; });
  }
  const pendingUrl = document.getElementById("pfVideo").value.trim();
  if(pendingUrl){ const ig = igInfo(pendingUrl); if(ig && ig.bad){ toast("رابط إنستجرام ده مش مدعوم — استخدم رابط الريل أو البوست نفسه"); return; } }
  const pendingFinal = pendingUrl ? withVidOri(pendingUrl) : "";
  if(pendingFinal && !(window._editingVideos||[]).includes(pendingFinal)) (window._editingVideos=window._editingVideos||[]).push(pendingFinal);
  const vids = (window._editingVideos||[]).slice();
  const obj = {
    id, name,
    cat: document.getElementById("pfCat").value,
    price: newPrice,
    desc: document.getElementById("pfDesc").value.trim(),
    video: "",
    videos: vids,
    images: (window._editingImages||[]).slice(),
    demo:false
  };
  if(sizes.length) obj.sizes = sizes;
  if(colors.length) obj.colors = colors;
  if(variants) obj.variants = variants;
  if(document.getElementById("pfThumbBg").value==="none") obj.thumbBg = "none";
  if(isEdit){ if(oldP.code) obj.code = oldP.code; if(Array.isArray(oldP.vcodes) && oldP.vcodes.length) obj.vcodes = oldP.vcodes; }   // الأكواد القادمة من الإكسيل ما تتمسحش عند تعديل المنتج
  { /* حماية: حجم بيانات المتجر كلها لازم يفضل أقل من حد النشر */
    const total = JSON.stringify(DATA).length - (isEdit ? JSON.stringify(oldP).length : 0) + JSON.stringify(obj).length;
    if(total > storeMax()){ toast("حجم بيانات المتجر (صور + فيديوهات) كبير جدًا على النشر — احذف فيديو/صور أو استخدم رابط فيديو"); return; }
  }
  if(isEdit){ const i=DATA.products.findIndex(p=>p.id===id); DATA.products[i]=obj; }
  else DATA.products.push(obj);
  saveData(DATA); closeModal(); renderAdminProducts(); toast("تم حفظ المنتج");
}

/* ================= نسخة GitHub: الصور والفيديوهات كملفات منفصلة (ZIP) =================
   الفكرة: index.html بيطلع خفيف (النصوص والأسعار بس) وكل صورة/فيديو جديد بيتحفظ كملف مستقل جوه فولدر media.
   الصفحة بتشير للملفات بمسار نسبي (media/اسم.jpg)، فمفيش حد لإجمالي حجم الميديا غير مساحة GitHub نفسه.
   أسماء الملفات مبنية على محتواها، فنفس الصورة ليها نفس الاسم دايماً ومفيش تعارض بين مرة والتانية. */
const JFY_BLOBS = new Map();                 // رابط مؤقت (blob:) -> {file, name} للفيديوهات الكبيرة اللي لسه ما اتنزلتش
const JFY_MAX_GH_FILE = 95*1024*1024;        // فوق ده GitHub بيرفض الملف
const JFY_MAX_WEB_FILE = 24*1024*1024;       // متصفح GitHub بيقبل لحد 25MB للملف الواحد
function jfyBlobMode(){ return !(window.claude && typeof window.claude.use === "function"); }
function jfyHasBlobVideos(){
  try{ return (DATA.products||[]).some(p=>[].concat(p.videos||[], p.video||[]).some(v=>typeof v==="string" && v.indexOf("blob:")===0)); }catch(e){ return false; }
}
const JFY_CRC_T = (function(){ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); t[n]=c>>>0; } return t; })();
async function jfyScanBlob(blob){   // CRC32 + بصمة تانية على أجزاء (من غير ما نحمّل الملف كله في الذاكرة)
  let crc=0xFFFFFFFF, h=0x811c9dc5; const CH=4*1024*1024;
  for(let o=0;o<blob.size;o+=CH){
    const u8 = new Uint8Array(await blob.slice(o, Math.min(o+CH, blob.size)).arrayBuffer());
    for(let i=0;i<u8.length;i++){ const b=u8[i]; crc = JFY_CRC_T[(crc^b)&255] ^ (crc>>>8); h = Math.imul(h^b, 16777619); }
  }
  return {crc:(crc^0xFFFFFFFF)>>>0, fnv:h>>>0};
}
function jfyParseDataUrl(u){
  const m = /^data:([^;,]*)((?:;[^;,]*)*?);base64,/i.exec(u); if(!m) return null;
  const mk = /;jfybg=([a-z])/i.exec(m[2]||"");
  return {mime:(m[1]||"").toLowerCase(), marker: mk ? mk[1].toLowerCase() : "", b64: u.slice(m[0].length)};
}
function jfyB64ToBlob(b64, mime){
  const parts=[], CH=4*65536;   // مضاعف 4 عشان كل جزء base64 يتفك لوحده
  for(let o=0;o<b64.length;o+=CH){
    const bin = atob(b64.slice(o, o+CH)), u8 = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
    parts.push(u8);
  }

}
function jfyExt(mime, name, kind){
  const M={"image/jpeg":"jpg","image/jpg":"jpg","image/png":"png","image/webp":"webp","image/gif":"gif","image/avif":"avif","video/mp4":"mp4","video/webm":"webm","video/quicktime":"mov","video/ogg":"ogv","video/3gpp":"3gp","video/x-matroska":"mkv","video/x-msvideo":"avi","video/mpeg":"mpg","video/x-m4v":"m4v"};
  if(M[mime]) return M[mime];

}
function jfyBuildZip(entries){   // ZIP بدون ضغط (store) — الصور والفيديوهات مضغوطة أصلاً
  if(entries.length > 65000) throw new Error("عدد الملفات كبير جداً على ملف ZIP واحد");

    lh.setUint16(10,dt,true); lh.setUint16(12,dd,true); lh.setUint32(14,e.crc,true); lh.setUint32(18,size,true); lh.setUint32(22,size,true);
    lh.setUint16(26,nb.length,true); lh.setUint16(28,0,true);
    parts.push(lh.buffer, nb, e.blob);
    const ch = new DataView(new ArrayBuffer(46));

    ch.setUint16(28,nb.length,true); ch.setUint16(30,0,true); ch.setUint16(32,0,true); ch.setUint16(34,0,true); ch.setUint16(36,0,true);
    ch.setUint32(38,0,true); ch.setUint32(42,offset,true);
    central.push(ch.buffer, nb);
    offset += 30 + nb.length + size;
  });
  let cs=0; central.forEach(x=>{ cs += (x.byteLength!==undefined ? x.byteLength : x.length); });

  end.setUint32(0,0x06054b50,true); end.setUint16(8,entries.length,true); end.setUint16(10,entries.length,true); end.setUint32(12,cs,true); end.setUint32(16,offset,true);
