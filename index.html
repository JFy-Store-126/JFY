  openModal(`<div style="line-height:1.9">
    <h3 style="margin:0 0 6px">✅ اتنزّلت نسخة GitHub</h3>
    <p style="margin:0 0 8px;font-size:13px">الملف: <b dir="ltr">JFY_Store_GitHub.zip</b> — فيه <b dir="ltr">index.html</b> (${mb(htmlSize)}) و${files.size ? "<b>"+files.size+"</b> ملف جديد جوه فولدر <b dir=\"ltr\">media</b>" : "من غير ملفات ميديا جديدة"}.</p>
    ${rows}${more}${warn}
    <ol style="margin:10px 0 0;padding-right:18px;font-size:13px">
      <li>فك ضغط الملف على جهازك.</li>
      <li>على GitHub: <b>Add file ← Upload files</b>، و<b>اسحب بالماوس</b> <b dir="ltr">index.html</b> وفولدر <b dir="ltr">media</b> مع بعض جوه المربع (متستخدمش زرار choose your files لأنه مش بيختار فولدرات).</li>
      <li>اضغط <b>Commit changes</b> واستنى دقيقة أو اتنين.</li>
    </ol>
    <p style="margin:8px 0 0;font-size:12px;color:var(--muted)">الصور والفيديوهات القديمة اللي على GitHub مش محتاجة ترفعها تاني. ارفع الجديد بس.</p>
    <button class="btn-primary" style="margin-top:12px" onclick="closeModal()">تمام</button>
  </div>`);
}
/* فحص الصور والفيديوهات على الموقع المنشور: بيتأكد إن كل ملف media/ مرجوع في المنتجات موجود فعلاً على GitHub */
async function jfyCheckMedia(){
  const box = t => openModal('<div style="line-height:1.9"><h3 style="margin:0 0 6px">🔎 فحص الصور والفيديوهات</h3>'+t+'<button class="btn-primary" style="margin-top:12px" onclick="closeModal()">تمام</button></div>');
  if(location.protocol !== "https:" && location.protocol !== "http:"){
    box('<p style="font-size:13px">الفحص بيشتغل على <b>الموقع المنشور</b> بس. افتح موقعك على GitHub Pages (الرابط اللي بيبدأ بـ https) وادخل لوحة التحكم وجرّب تاني.</p>'); return;
  }
  const items = new Map();
  const add = (p, v, kind)=>{
    if(typeof v !== "string") return;
    const base = v.replace(/#(jfy|jfybg)=[a-z]$/, "");
    if(!/^media\//.test(base)) return;
    if(!items.has(base)) items.set(base, {path:base, kind:kind, prods:[]});
    const it = items.get(base); if(it.prods.indexOf(p.name) < 0) it.prods.push(p.name);
  };
  (DATA.products||[]).forEach(p=>{ (p.images||[]).forEach(v=>add(p,v,"image")); (p.videos||[]).forEach(v=>add(p,v,"video")); if(typeof p.video==="string" && p.video) add(p,p.video,"video"); });
  if(!items.size){ box('<p style="font-size:13px">مفيش صور أو فيديوهات محفوظة كملفات منفصلة في المتجر ده لسه، فمفيش حاجة تتفحص.</p>'); return; }
  const btn = document.getElementById("btnCheckMedia"); if(btn){ btn.disabled = true; btn.textContent = "⏳ جاري الفحص..."; }
  try{
    const list = Array.from(items.values()), bad = []; let idx = 0;
    const worker = async ()=>{ while(idx < list.length){ const it = list[idx++];
      try{ const r = await fetch(it.path, {method:"HEAD", cache:"no-store"}); if(!r.ok) bad.push(Object.assign({code:r.status}, it)); }
      catch(e){ bad.push(Object.assign({code:0}, it)); } } };
    await Promise.all([worker(), worker(), worker(), worker()]);
    if(!bad.length){
      box('<div class="ok" style="background:#ddf4e4;border:1px solid #8fd1a4;border-radius:10px;padding:10px 12px;font-size:13.5px">✅ كل الملفات (<b>'+list.length+'</b>) موجودة على الموقع. لو لسه مش ظاهرة عندك، اعمل تحديث إجباري (Ctrl + F5).</div>');
    }else{
      const rows = bad.slice(0,15).map(b=>'<div style="direction:ltr;text-align:left;font-size:12px;padding:3px 0;border-bottom:1px solid var(--border)">'+escapeHtml(b.path)+' <span style="color:#b3261e">('+(b.code||"خطأ اتصال")+')</span><div dir="rtl" style="color:var(--muted)">'+escapeHtml(b.prods.join("، "))+'</div></div>').join("");
      box('<div style="background:#fdecea;border:1px solid #e08a84;border-radius:10px;padding:10px 12px;font-size:13.5px">⚠️ <b>'+bad.length+'</b> ملف من <b>'+list.length+'</b> مش موجود على الموقع:</div>'+rows+(bad.length>15?'<div style="font-size:12px;color:var(--muted)">+ '+(bad.length-15)+' ملف تاني</div>':'')+
        '<ol style="margin:10px 0 0;padding-right:18px;font-size:13px"><li>افتح الـ Repository على GitHub: لازم تشوف <b dir="ltr">index.html</b> وفولدر <b dir="ltr">media</b> <b>جنب بعض</b> في الصفحة الرئيسية (مش جوه فولدر تاني).</li><li>افتح فولدر <b dir="ltr">media</b> وتأكد إن الملفات اللي فوق موجودة بنفس الأسماء.</li><li>لو ناقصة: ارفع فولدر <b dir="ltr">media</b> كله بالسحب والإفلات (مش بزرار choose your files)، واضغط Commit changes، واستنى دقيقتين وافحص تاني.</li></ol>');
    }
  }catch(e){ box('<p style="font-size:13px">حصلت مشكلة في الفحص: '+escapeHtml(String(e && e.message || e))+'</p>'); }
  finally{ const b2 = document.getElementById("btnCheckMedia"); if(b2){ b2.disabled = false; b2.textContent = "🔎 فحص الصور والفيديوهات على الموقع"; } }
}

    for(var yy = 0; yy < h; yy++){
      for(var xx = 0; xx < w; xx++){
        var i = (yy*w + xx) * 4, a = d[i+3];
        if(xx < t || yy < t || xx >= w-t || yy >= h-t){
          ring++;
          if(a > 240){ ringOpaque++; rr += d[i]; rg += d[i+1]; rb += d[i+2]; rows.push([d[i], d[i+1], d[i+2]]); }
        }
        if(a > 16){
          if(xx < minX) minX = xx; if(xx > maxX) maxX = xx;
          if(yy < minY) minY = yy; if(yy > maxY) maxY = yy;
          if(a > 128){ lumSum += (0.2126*d[i] + 0.7152*d[i+1] + 0.0722*d[i+2]) / 255; lumN++; }
        }
      }
    }
    var opaqueEdge = ring > 0 && ringOpaque / ring >= 0.9;
    if(opaqueEdge){
      var mr = rr/ringOpaque, mg = rg/ringOpaque, mb = rb/ringOpaque, dev = 0;
      for(var j = 0; j < rows.length; j += 3){
        dev = Math.max(dev, Math.abs(rows[j][0]-mr), Math.abs(rows[j][1]-mg), Math.abs(rows[j][2]-mb));
      }
      /* حافة موحّدة اللون → نكمّل الأيقونة بنفس لون خلفية اللوجو عشان تبان كأنها قطعة واحدة */
      var bg = dev <= 40 ? "#" + hex2(mr) + hex2(mg) + hex2(mb) : "#FFFFFF";
      return {bg: bg, sx: 0, sy: 0, sw: W, sh: H};
    }
    /* لوجو شفاف: نقصّ الهوامش الفاضية، ونختار خلفية بيضاء أو كحلي حسب فاتح/غامق اللوجو */
    if(maxX < 0){ return {bg: "#FFFFFF", sx: 0, sy: 0, sw: W, sh: H}; }
    var lum = lumN ? lumSum / lumN : 0;
    var inv = 1 / k;
    return {
      bg: lum > 0.72 ? "#101E38" : "#FFFFFF",
      sx: Math.max(0, Math.floor(minX*inv)), sy: Math.max(0, Math.floor(minY*inv)),
      sw: Math.min(W, Math.ceil((maxX-minX+1)*inv)), sh: Math.min(H, Math.ceil((maxY-minY+1)*inv))
    };
  }

  function render(img, info, size, frac){
    var c = document.createElement("canvas"); c.width = size; c.height = size;
    var x = c.getContext("2d");
    x.fillStyle = info.bg; x.fillRect(0, 0, size, size);
    var box = size * frac, r = Math.min(box / info.sw, box / info.sh);
    var dw = info.sw * r, dh = info.sh * r;
    x.imageSmoothingEnabled = true; x.imageSmoothingQuality = "high";
    x.drawImage(img, info.sx, info.sy, info.sw, info.sh, (size-dw)/2, (size-dh)/2, dw, dh);
    return c.toDataURL("image/png");
  }

  function setLink(key, rel, sizes, href, type){
    var el = document.head.querySelector('link[data-jfy-pwa="' + key + '"]');
    if(!el){ el = document.createElement("link"); el.setAttribute("data-jfy-pwa", key); document.head.appendChild(el); }
    el.setAttribute("rel", rel);
    if(sizes) el.setAttribute("sizes", sizes); else el.removeAttribute("sizes");
    if(type) el.setAttribute("type", type); else el.removeAttribute("type");
    el.setAttribute("href", href);
  }

  async function apply(){
    var src = (typeof DATA !== "undefined" && DATA && DATA.logo) || (typeof LOGO_DEFAULT !== "undefined" ? LOGO_DEFAULT : null);
    if(!src) return;
    var key = src.length + ":" + src.slice(-64);
    if(key === lastKey) return;
    var img = await loadImg(src);
    var info = analyze(img);
    var name = (typeof STORE_NAME !== "undefined" && STORE_NAME) || document.title || "JFY Store";

    var any512 = render(img, info, 512, 0.84), any192 = render(img, info, 192, 0.84);
    var mask512 = render(img, info, 512, 0.62), mask192 = render(img, info, 192, 0.62);
    var apple180 = render(img, info, 180, 0.80);
    var fav32 = render(img, info, 64, 0.90);

    setLink("fav", "icon", "64x64", fav32, "image/png");
    setLink("fav192", "icon", "192x192", any192, "image/png");
    setLink("apple", "apple-touch-icon", "180x180", apple180);

    /* manifest: بيتبني من اللوجو الحالي، وبيتفتح بدون شريط المتصفح */
    if(location.protocol === "http:" || location.protocol === "https:"){
      var u = new URL(location.href); u.hash = "";
      var m = {
        name: name, short_name: name, description: name + " — Just For You",
        lang: "ar", dir: "rtl",
        start_url: u.href, scope: new URL("./", u).href,
        display: "standalone", display_override: ["standalone", "minimal-ui"],
        background_color: info.bg, theme_color: "#FFFFFF",
        icons: [
          {src: any192,  sizes: "192x192", type: "image/png", purpose: "any"},
          {src: any512,  sizes: "512x512", type: "image/png", purpose: "any"},
          {src: mask192, sizes: "192x192", type: "image/png", purpose: "maskable"},
          {src: mask512, sizes: "512x512", type: "image/png", purpose: "maskable"}
        ]
      };
      var blobUrl = URL.createObjectURL(new Blob([JSON.stringify(m)], {type: "application/manifest+json"}));
      setLink("manifest", "manifest", null, blobUrl);
      if(manifestUrl){ try{ URL.revokeObjectURL(manifestUrl); }catch(e){} }
      manifestUrl = blobUrl;
    }
    lastKey = key;
    window.JFY_APP_ICONS = {bg: info.bg, any512: any512, any192: any192, mask512: mask512, apple180: apple180, fav: fav32};
  }

  window.jfyApplyAppIcons = function(){
    busy = (busy || Promise.resolve()).then(apply).catch(function(e){ console.warn("app icon", e); });
    return busy;
  };
  window.jfyApplyAppIcons();
})();
</script>
